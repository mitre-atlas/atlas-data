  AML.CS0069:
    name: GTG-1002 Claude Code Espionage Campaign
    description: 'In September 2025, GTG-1002 used a jailbroken Claude Code agent
      to conduct a cyber-espionage campaign against approximately 30 organizations,
      succeeding against a small number. Anthropic assessed with high confidence that
      GTG-1002 was a Chinese state-sponsored group.


      GTG-1002 selected organizations in the technology, financial, chemical-manufacturing,
      and government sectors and configured an autonomous attack framework to operate
      against them. The operators obtained access to Claude Code and circumvented
      its safeguards by concealing their malicious purpose behind a false defensive-security
      persona and apparently benign tasks. GTG-1002 then connected the jailbroken
      Claude agent to scanners, browser automation, password crackers, database tooling,
      and dedicated penetration-testing servers through MCP.


      Between operator-controlled stage gates, the adversary''s jailbroken Claude
      agent autonomously inspected target infrastructure, identified high-value systems,
      scanned for vulnerabilities, and developed and deployed a tailored exploit chain
      for an identified SSRF vulnerability. After obtaining access to a target, it
      mapped internal resources and network relationships, found authentication certificates
      in system configuration files, used harvested credentials to access additional
      services, established a backdoor account, and collected sensitive information
      from local systems and internal databases.


      The adversary''s jailbroken Claude agent performed an estimated 80-90% of campaign
      activity, including processing collected data, categorizing it by intelligence
      value, and documenting attack progress. Human operators retained approximately
      four to six critical decisions per target, including review and approval before
      selected data was exfiltrated over the Claude web service.'
    references:
    - id: anthropic-espionage
      title: Disrupting the First Reported AI-Orchestrated Cyber Espionage Campaign
      url: https://www.anthropic.com/news/disrupting-AI-espionage
    - id: attack-c0062
      title: Anthropic AI-Orchestrated Campaign C0062
      url: https://attack.mitre.org/campaigns/C0062/
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    type: Incident
    actor: GTG-1002
    target: 30 entities in the technology, financial, chemical, and government sectors
    reporter: Anthropic
    date: '2025-09-01'
    date-granularity: Month
    id: AML.CS0069
    uuid: e7222a71-e614-5bec-9a0d-9f5d906920af
    object-type: case-study
  AML.CS0070:
    name: Threat Actor Uses a DeepSeek-Powered Hermes Agent in Langflow and n8n Exploitation
      Attempts
    description: 'A Chinese-speaking threat actor operating as knaithe or KnYuan configured
      Hermes Agent to use DeepSeek as its reasoning engine. Hermes supplied terminal
      access, Telegram-based operator control, and a skills system containing both
      bundled and actor-created red-team skills. The actor also integrated an MCP
      server that exposed FOFA search, query translation, and Nuclei scan-generation
      capabilities.


      Unit 42 recovered a detailed Hermes Agent session dated May 7, 2026. The actor
      supplied an initial task through Telegram, but Unit 42 recovered no additional
      operator input during the session. The DeepSeek-powered Hermes Agent then autonomously
      searched for targets, obtained public exploits, ran scans, evaluated the results,
      and revised its approach.


      The agent initially targeted Langflow using a public exploit for CVE-2026-33017.
      After determining that available targets lacked the exploit''s prerequisites,
      it abandoned that path, compared vulnerabilities across 10 product families,
      and selected n8n based on apparent severity, exposure, and exploitability. It
      then obtained a public exploit chain for CVE-2026-21858 and CVE-2025-68613 and
      probed candidate systems identified through FOFA. Although several systems appeared
      to run affected versions, the agent found that they lacked the required unauthenticated
      file-upload functionality. None of the autonomous exploitation attempts obtained
      access.


      Separate workspace evidence documented manual actor activity involving Citrix
      NetScaler data extraction, Marimo command execution, and reverse-shell attempts
      against Tomcat and IKE VPN systems.


      Unit 42 obtained this visibility after Hermes Agent responded to a Telegram
      command by starting an HTTP file server from the actor''s home directory, `/home/worker`,
      instead of an isolated staging directory. This unintentionally exposed the actor''s
      workspace, including AI tool configurations, API keys, exploit scripts, target
      lists, Bash history, and autonomous exploitation session logs.'
    references:
    - id: unit42-autonomous-campaign
      title: Chinese-Speaking Threat Actor Harnesses AI Models for Autonomous Cyberattacks
      url: https://unit42.paloaltonetworks.com/autonomous-ai-cyber-attack-campaign/
    created-date: '2026-08-30'
    modified-date: '2026-08-30'
    type: Incident
    actor: Chinese-speaking threat actor using the aliases knaithe and KnYuan
    target: Publicly exposed Langflow and n8n systems, primarily in China
    reporter: Palo Alto Networks Unit 42
    date: '2026-05-07'
    date-granularity: Day
    id: AML.CS0070
    uuid: 272a8fbf-586c-57b7-848c-12e683c05a8a
    object-type: case-study
  AML.CS0071:
    name: Multi-Agent Framework Compromises Taiwanese Government Systems
    description: 'In early July 2026, an unknown Chinese-language operator used a
      multi-agent framework built on Hermes and OpenClaw against government systems
      that subsequent public reporting identified as Taiwanese.[[financial-times-taiwan-ai-attack]]
      Dream Research Labs recovered a 160 MB operational workspace containing 1,395
      files documenting 12 attack waves conducted from July 1 through July 4.[[dream-multi-agent-framework]]
      Taiwan''s Ministry of Digital Affairs separately confirmed[[moda-ai-agent-attacks]]
      detecting abnormal attacks during July involving a hybrid of human operation
      and OpenClaw-assisted activity.


      The agentic AI framework coordinated up to eight specialized sub-agents concurrently
      across reconnaissance, authentication attacks, API testing, vulnerability research,
      and exploitation. A probabilistic decision engine ranked findings and 14 candidate
      attack paths, allocated additional testing to promising results, discarded invalidated
      paths, and used after-action reports to redirect subsequent activity.


      Starting from an internet-facing government portal, the framework decompiled
      client-side application bundles and mapped connected systems, identity infrastructure,
      and exposed APIs. It obtained access through exposed debug endpoints, unsigned
      JWT acceptance, and password spraying based on personnel identifiers collected
      from unauthenticated APIs. Tesseract OCR automated CAPTCHA solving, reportedly
      helping compromise 85 accounts, 84 of which authenticated to another government
      system through an SSO bridge without additional MFA or user confirmation.


      Dream Research Labs reported the extraction of more than 2,564 personnel records,
      a complete user-database export, SSO configuration and client information, database
      credentials, and internal network ranges.'
    references:
    - id: dream-multi-agent-framework
      title: Inside a Multi-Agent AI Framework Used to Compromise Government Entities
        in Asia
      url: https://www.dreamgroup.com/blog/inside-a-multi-agent-ai-framework-used-to-compromise-government-entities-in-asia
    - id: moda-ai-agent-attacks
      title: Overseas hackers launch AI-agent attacks against government agencies;
        MODA activates coordinated response and strengthens cyber defenses
      url: https://moda.gov.tw/ACS/press/news/press/20394
    - id: financial-times-taiwan-ai-attack
      title: China-linked hackers hit Taiwan in unprecedented 'autonomous' AI cyber
        attack
      url: https://www.ft.com/content/7d2ab3e0-9085-48f6-b38a-d90260d58795
    created-date: '2026-08-30'
    modified-date: '2026-08-30'
    type: Incident
    actor: Unknown Chinese-language actor
    target: Taiwanese government agencies and connected government systems
    reporter: Dream Research Labs
    date: '2026-07-01'
    date-granularity: Day
