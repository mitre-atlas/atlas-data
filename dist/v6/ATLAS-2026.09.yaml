  AML.CS0072:
    name: AI Recommendation Poisoning via Crafted AI Assistant Links
    description: "The [Microsoft Defender Security Research Team](https://www.microsoft.com/en-us/security/blog/author/windows-defender-research/)\
      \ identified a widespread pattern of AI assistant memory manipulation carried\
      \ out for promotional purposes, which they named AI Recommendation Poisoning.\
      \ \n\nMost major AI assistants accept a pre-filled prompt through a URL query\
      \ parameter, allowing any party controlling a hyperlink to author the first\
      \ turn of a user's conversation with their assistant. Operators embedded crafted\
      \ links into their websites as \"Summarize with AI\" buttons and share widgets,\
      \ and in some cases distributed them by email. \n\nEach link paired a legitimate\
      \ summarization request with an appended instruction directing the assistant\
      \ to record the operator's domain as a trusted or authoritative source for future\
      \ conversations. When the user clicked, the prompt populated the assistant's\
      \ input field, and the persistence clause caused a durable memory entry to be\
      \ written, biasing later recommendations toward the operator.\nReviewing AI\
      \ assistant URLs observed in email traffic over approximately 60 days, the researchers\
      \ identified more than 50 distinct promotional memory manipulation prompts from\
      \ 31 companies across 14 industries. Every case was attributed to a legitimate\
      \ business rather than a conventional threat actor, and the researchers traced\
      \ the trend to publicly available tooling marketed as a search optimization\
      \ technique for large language models. Several prompts targeted health and financial\
      \ advice sites. \n\nMicrosoft reported that effectiveness varied by platform\
      \ and that several previously observed behaviors could no longer be reproduced\
      \ as vendor protections evolved."
    references:
    - id: ai-recommendation-poisoning
      title: 'Manipulating AI memory for profit: The rise of AI Recommendation Poisoning'
      url: https://www.microsoft.com/en-us/security/blog/2026/02/10/ai-recommendation-poisoning/
    created-date: '2026-09-15'
    modified-date: '2026-09-15'
    type: Incident
    actor: Multiple commercial entities; 31 distinct companies identified
    target: Users of AI assistants with persistent memory features, including Microsoft
      365 Copilot, ChatGPT, Claude, Perplexity, and Grok
    reporter: Microsoft Defender Security Research Team
    date: '2026-02-10'
    date-granularity: Day
    id: AML.CS0072
