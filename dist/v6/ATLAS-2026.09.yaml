  AML.CS0072:
    employs:
    - source: AML.CS0072
      target: AML.T0016
      relationship-type: employs
      description: Operators adopted publicly available tooling built to generate
        AI assistant links carrying embedded memory instructions. The tooling included
        an npm package, a web-based link generator, and website plugins marketed as
        a search optimization technique for large language models.
      tactic: AML.TA0003
      step-id: S00
      leads-to:
      - S01
    - source: AML.CS0072
      target: AML.T0068
      relationship-type: employs
      description: The instruction was concealed from the user behind a benign interface
        label, with the prompt text visible only in the URL. Bundling it with a genuine
        summarization request made the resulting assistant behavior appear expected.
      tactic: AML.TA0007
      step-id: S03
      leads-to:
      - S04
    - source: AML.CS0072
      target: AML.T0079
      relationship-type: employs
      description: Operators embedded the crafted link into their own web properties
        as a "Summarize with AI" button or share widget. In some cases, the same links
