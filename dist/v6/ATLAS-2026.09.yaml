        artifact integrity, deployment approval, monitoring, and recovery.
    - source: AML.M0035
      target: AML.T0018.000
      relationship-type: mitigates
      description: Test whether controlled changes to model weights, fine-tuning,
        or associated artifacts can introduce targeted or persistent behavior. Improve
        model provenance, validation, integrity monitoring, and rollback.
    - source: AML.M0035
      target: AML.T0018.001
      relationship-type: mitigates
      description: Attempt controlled unauthorized changes to model architecture or
        executable model components. Verify review, integrity checking, signing, deployment
        approval, and restoration controls.
    - source: AML.M0035
      target: AML.T0020
      relationship-type: mitigates
      description: Introduce controlled poisoned records or triggers into representative
        data pipelines. Verify and improve provenance, sanitization, review, drift
        detection, model validation, and rollback controls.
    - source: AML.M0035
      target: AML.T0024
      relationship-type: mitigates
      description: Exercise inference interfaces for membership inference, model inversion,
        and functional extraction. Use findings to improve privacy controls, authentication,
        output restriction, rate limits, and monitoring.
    - source: AML.M0035
      target: AML.T0024.000
      relationship-type: mitigates
      description: Test whether model outputs reveal the membership of known training
        samples. Improve privacy-preserving training, output restriction, access controls,
        and query monitoring.
    - source: AML.M0035
      target: AML.T0024.001
      relationship-type: mitigates
      description: Attempt to reconstruct sensitive records, attributes, or representative
        training information from model outputs. Remediate leakage through model changes,
        output minimization, privacy controls, and restricted inference access.
    - source: AML.M0035
      target: AML.T0024.002
      relationship-type: mitigates
      description: Simulate functional model extraction through inference queries.
        Establish appropriate authentication, rate limits, output restrictions, anomaly
        detection, and extraction monitoring.
    - source: AML.M0035
      target: AML.T0029
      relationship-type: mitigates
      description: Submit adversarial workloads and exercise dependency failures that
        could exhaust inference or supporting services. Apply quotas, concurrency
