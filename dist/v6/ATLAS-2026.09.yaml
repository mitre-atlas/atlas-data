  AML.CS0057:
    name: Storm-2139 Azure OpenAI Guardrail Bypass
    description: 'Storm-2139 built custom jailbreak tooling to bypass guardrails on
      Azure OpenAI Services, allowing users to generate harmful synthetic content.


      Microsoft reported that members of Storm-2139 scraped exposed customer credentials
      from public sources and used them to access accounts for generative AI services.
      The group developed and operated tools and services that bypassed safety safeguards,
      modified service capabilities, and enabled end users to generate harmful and
      illicit content, including non-consensual intimate images of celebrities and
      other sexually explicit content.


      The operation included creators who developed illicit tools, providers who modified
      and supplied those tools, and users who generated prohibited content. Microsoft
      pursued civil legal action.'
    references:
