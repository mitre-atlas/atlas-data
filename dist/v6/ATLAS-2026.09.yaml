    - id: envrl
      title: 'EnvRL: Learn from Environment Dynamics in Agentic Reinforcement Learning'
      url: https://arxiv.org/html/2606.17680v1
    - id: rlef
      title: 'RLEF: Grounding Code LLMs in Execution Feedback with Reinforcement Learning'
