  AML.M0036:
    mitigates:
    - source: AML.M0036
      target: AML.T0029
      relationship-type: mitigates
      description: Limit the resources consumed by individual requests to reduce denial
        of service from computationally expensive inputs.
    - source: AML.M0036
      target: AML.T0034
      relationship-type: mitigates
      description: Apply resource budgets to AI requests and workflows to limit costs
        from resource-intensive queries, excessive output, and uncontrolled agentic
        activity.
    - source: AML.M0036
      target: AML.T0034.001
      relationship-type: mitigates
      description: Bound input size, output size, execution time, memory, and compute
        consumed by resource-intensive queries.
    - source: AML.M0036
      target: AML.T0034.002
      relationship-type: mitigates
      description: Limit agent iterations, tool calls, fan-out, runtime, and downstream
        spending to constrain agentic resource consumption.
  AML.M0037:
    mitigates:
    - source: AML.M0037
      target: AML.T0116
      relationship-type: mitigates
      description: When an organization has sufficient administrative control over
        an AI system to enforce target restrictions, treating newly discovered targets
        and resources as outside the authorized boundary prevents autonomous reconnaissance
        from automatically expanding the agent's permitted target set or actively
        probing those targets without approval. These controls do not constrain reconnaissance
        performed by adversary-controlled AI systems over which the organization has
        no administrative control.
    - source: AML.M0037
      target: AML.T0117
      relationship-type: mitigates
      description: When an organization has sufficient administrative control over
        an AI system to enforce its authority boundaries, Authority Expansion Controls
        can directly constrain enabling objectives that seek new authorities, identities,
        execution environments, tools, communication paths, or trust relationships.
        These controls do not constrain adversary-controlled AI systems over which
        the organization has no administrative control.
    - source: AML.M0037
      target: AML.T0124
      relationship-type: mitigates
      description: When an organization has sufficient administrative control over
        an AI system to enforce delegation constraints, propagating the parent agent's
        authority constraints to sub-agents prevents autonomous orchestration from
        creating or directing executors with broader targets, permissions, or permitted
        actions than the originating agent. These controls do not constrain adversary-controlled
        multi-agent systems over which the organization has no administrative control.
  AML.M0038:
    mitigates:
    - source: AML.M0038
      target: AML.T0116
      relationship-type: mitigates
      description: When an organization has sufficient administrative control over
        an AI system to monitor its target selection and reconnaissance activity,
        Scope Drift Detection can identify when reconnaissance expands or substitutes
        targets in ways no longer consistent with the authorized objective. This control
        does not apply to adversary-controlled AI systems over which the organization
        has no administrative control.
    - source: AML.M0038
      target: AML.T0117
      relationship-type: mitigates
      description: When an organization has sufficient administrative control over
        an AI system to monitor its plans and actions, Scope Drift Detection evaluates
        whether dynamically generated intermediate actions are within the agent's
        task scope. This control does not apply to adversary-controlled AI systems
        over which the organization has no administrative control.
    - source: AML.M0038
      target: AML.T0124
      relationship-type: mitigates
      description: When an organization has sufficient administrative control over
        an AI system to monitor its planning and coordination activity, changes in
        task hierarchy, assignments, resource allocation, and newly initiated work
        provide observable signals that the orchestrator may be drifting from its
        authorized objective. This control does not apply to adversary-controlled
        AI systems over which the organization has no administrative control.
  AML.M0039:
    mitigates:
    - source: AML.M0039
      target: AML.T0000
      relationship-type: mitigates
      description: Decoy assets are catalogued by the same internet scan databases
        (e.g., Shodan, Censys) that adversaries query to locate exposed AI infrastructure.
        Adversarial engagement that originates from those platforms can grant defenders
        visibility into those discovery channels.
    - source: AML.M0039
      target: AML.T0000.003
      relationship-type: mitigates
      description: Decoy assets are catalogued by the same internet scan databases
        (e.g., Shodan, Censys) that adversaries query to locate exposed AI infrastructure.
        Adversarial engagement that originates from those platforms can grant defenders
        visibility into those discovery channels.
    - source: AML.M0039
      target: AML.T0006
      relationship-type: mitigates
      description: By capturing adversarial fingerprinting behavior, honeypots can
        help provide early warning of sweeping activity meant to discover exposed
        AI targets and attack surfaces being explored by adversaries.
    - source: AML.M0039
      target: AML.T0006.000
      relationship-type: mitigates
      description: By capturing adversarial fingerprinting behavior, honeypots can
        help provide early warning of sweeping activity meant to discover exposed
        AI targets and attack surfaces being explored by adversaries.
    - source: AML.M0039
      target: AML.T0006.001
      relationship-type: mitigates
      description: By capturing adversarial fingerprinting behavior, honeypots can
        help provide early warning of sweeping activity meant to discover exposed
        AI targets and attack surfaces being explored by adversaries.
    - source: AML.M0039
      target: AML.T0006.002
      relationship-type: mitigates
      description: By capturing adversarial fingerprinting behavior, honeypots can
        help provide early warning of sweeping activity meant to discover exposed
        AI targets and attack surfaces being explored by adversaries.
    - source: AML.M0039
      target: AML.T0006.003
      relationship-type: mitigates
      description: By capturing adversarial fingerprinting behavior, honeypots can
        help provide early warning of sweeping activity meant to discover exposed
        AI targets and attack surfaces being explored by adversaries.
    - source: AML.M0039
      target: AML.T0040
      relationship-type: mitigates
      description: 'Honeypots capture which endpoints adversaries are targeting and
        how they use discovered inference APIs: the models they''re interested in,
        the parameters they use, and the payloads they submit once they reach a live
        endpoint.'
    - source: AML.M0039
      target: AML.T0049
      relationship-type: mitigates
      description: Honeypots can safely absorb real attacks and exploit attempts,
        turning payloads into mapped defensive signatures for a potential target without
        risking real assets.
    - source: AML.M0039
      target: AML.T0084
      relationship-type: mitigates
      description: Honeypots can surface which agent configuration and related assets
        adversaries hunt for, exposing the reconnaissance that precedes agent-targeted
        attacks, and acting as both canary tokens and decoy.
    - source: AML.M0039
      target: AML.T0093
      relationship-type: mitigates
      description: Since honeypots capture real input, they can provide visibility
        into attacks and prompt payloads that are target-specific.
    - source: AML.M0039
      target: AML.T0095
      relationship-type: mitigates
      description: Decoy assets, such as honeypots, can act as a first contact for
        adversarial activity and reveal discovery channels that attackers are using
        to find web AI assets for targeting.
    - source: AML.M0039
      target: AML.T0095.000
      relationship-type: mitigates
      description: Decoy assets, such as honeypots, can act as a first contact for
        adversarial activity and reveal discovery channels that attackers are using
        to find web AI assets for targeting.
    - source: AML.M0039
      target: AML.T0132
      relationship-type: mitigates
      description: Honeypots can safely absorb real attacks and exploit attempts,
        turning payloads into mapped defensive signatures for a potential target without
        risking real assets.
    - source: AML.M0039
      target: AML.T0133
      relationship-type: mitigates
      description: Interactive agentic decoys can present a plausible but fake toolset
        and capabilities. When an adversary enumerates the agent's capabilities at
        runtime, the honeypot can capture which tools and privileges they probe for
        and how they attempt to exploit it, while planted decoy credentials can also
        be used as canary tokens.
