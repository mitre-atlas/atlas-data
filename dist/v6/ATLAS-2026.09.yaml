    object-type: mitigation
  AML.M0036:
    name: Limit AI Workload Resource Consumption
    description: 'Limit the resources that an AI request, inference job, or agent
      workflow can consume. Set bounds on input size, batch size, execution time,
      memory, compute, and output size. Generative AI services should also limit context
      and output tokens. Agentic AI systems should limit iterations, retries, tool
      calls, parallel tasks, delegation depth, and downstream spending.


      Apply resource limits across the complete workflow because one request may initiate
      multiple model calls or external actions. Use timeouts, cost ceilings, circuit
      breakers, and safe termination conditions to prevent individual workloads from
      exhausting shared resources. These controls complement query-rate limits, which
      address large numbers of otherwise inexpensive requests.'
    references:
    - id: owasp-llm10
      title: OWASP LLM10:2025 Unbounded Consumption
      url: https://genai.owasp.org/llmrisk/llm102025-unbounded-consumption/
    created-date: '2026-07-31'
    modified-date: '2026-07-31'
    lifecycle-phases:
    - Deployment
    - Monitoring and Maintenance
    categories:
    - Technical - AI
    id: AML.M0036
    uuid: 98919f42-697d-5b47-8bdd-d19724cc2f0c
    object-type: mitigation
  AML.M0037:
    name: AI Agent Authority Expansion Controls
    description: "Limit an AI agent's ability to autonomously acquire, assume, or\
      \ otherwise obtain additional authorities that expand its effective permissions\
      \ during execution. The maximum authority available to the agent should be explicitly\
      \ granted prior to runtime. Additional resources, identities, services, and\
      \ targets discovered during execution should be treated as outside the authorized\
      \ boundary unless they are independently validated and added to scope. All authority\
      \ expansion controls should be implemented outside the AI agent and should not\
      \ rely solely on system prompts, model alignment, or the agent recognizing that\
      \ an action is out of scope. Implementations of these controls may be achieved\
      \ through enforcement mechanisms such as: \n\n- Policy engines\n- Target allowlists\n\
      - Protocol and destination restrictions\n- Approval gates\n- Preventing the\
      \ agent from using credentials that were not approved for the task\n- Monitoring\
      \ and auditing changes in the agent's effective authority over time\n\nAuthority\
      \ expansion controls include placing restrictions on the number, scope, duration,\
      \ and concurrent use of authentication and/or authorization tokens available\
      \ during execution. Tokens may include API access tokens, OAuth tokens, cloud\
      \ IAM session credentials, service account tokens, Git tokens, or other short-lived\
      \ authentication artifacts. When policy limits are reached or exceeded, organizations\
      \ may revoke access, prevent additional token acquisition, require human approval,\
      \ or terminate the agent's execution.\n\nPropagate the original authority constraints\
      \ to sub-agents and delegated tasks. A delegated agent may receive narrower\
      \ restrictions but should not expand the parent agent's scope, authority, targets,\
      \ or permitted actions.\n\nAuthority expansion controls should be implemented\
      \ alongside permissions configurations for AI agents and tools (See [Privileged\
      \ AI Agent Permissions Configuration](/mitigations/AML.M0026), [Single-User\
      \ AI Agent Permissions Configuration](/mitigations/AML.M0027), [AI Agent Tools\
      \ Permissions Configuration](/mitigations/AML.M0028)). Attempted changes in\
      \ scope should be accompanied with [Human In-the-Loop for AI Agent Actions](/mitigations/AML.M0029).\
      \ Log new resource discovery, denials, exceptions, approvals, and scope changes\
      \ using [AI Telemetry Logging](/mitigations/AML.M0024)."
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    lifecycle-phases:
    - Deployment
    - Monitoring and Maintenance
    categories:
    - Technical - AI
    id: AML.M0037
    uuid: d2fe3047-eae5-5a06-bc30-c319228a1665
    object-type: mitigation
  AML.M0038:
    name: AI Agent Scope Drift Detection
    description: "Continuously evaluate whether an AI Agent's planned actions remain\
      \ consistent with its current authorized objective throughout execution. As\
      \ autonomous agents interact within a dynamic environment, they may discover\
      \ or generate intermediate objectives or adapt their strategy based on environment\
      \ feedback. While limited adaption may be necessary to complete legitimate tasks,\
      \ substantial deviations from the original objective may indicate unintended\
      \ behavior, excessive autonomy, or attempts to pursue objectives outside the\
      \ authorized scope. \n\nImplementation of scope drift detection can vary through\
      \ runtime policy engines, planning monitors, orchestration frameworks, or additional\
      \ supervisory AI Agents. Indicators to monitor may include:\n\n- Significant\
      \ changes in planned objectives or task hierarchy.\n- Generation of new long-term\
      \ goals unrelated to the assigned objective.\n- Tool usage inconsistent with\
      \ the original mission.\n- Attempts to access systems or resources outside the\
      \ authorized scope.\n- Repeated adaptation toward objectives requiring progressively\
      \ broader authority.\n- Planning sequences that introduce persistence, privilege\
      \ escalation, or unrelated lateral movement.\n\nWhen scope drift is detected,\
      \ pause execution, restrict tool access, require external approval, return the\
      \ agent to a known authorized plan, or terminate the task."
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    lifecycle-phases:
    - Monitoring and Maintenance
    categories:
    - Technical - AI
    id: AML.M0038
    uuid: b34213fd-c1b5-5205-8266-45c11726bb40
    object-type: mitigation
  AML.M0039:
    name: AI Honeypots
    description: 'Deploy monitored decoy AI services, agents, credentials, or other
      resources that resemble legitimate, active assets in the external or internal
      environment, but serve no real business or operational functions. Because authorized
      users and workflows have no reason to engage with these resources, any interaction
      with them is a high-confidence indicator of unauthorized activity such as reconnaissance,
      or discovery. AI decoys have been shown to surface high-volume reconnaissance
      and actionable intelligence on threat actors'' activities[[greynoise]][[zenity]].


      Positioning honeypot decoys alongside genuine resources helps surface both broad
      and targeted recon, since an adversary mapping reachable resources in an environment
      will tend to engage the decoys as well as the real assets. AI decoys that are
      set up as enticing targets for attackers in different ways can potentially capture
      how an adversary probes, manipulates, or attempts to abuse them. This can reveal
      the adversary''s intent beyond initial reconnaissance (i.e. what they attempt
      once engaged), as well as the tactics, techniques and procedures used by the
      adversary.


      Interactions with decoy resources can be collected and analyzed to build a threat
      intelligence feed, capturing adversary source information, tooling, prompts,
      and techniques. This intelligence can be fed back into detection rules and defenses
      across the wider environment, while the placed decoys themselves can help confuse
      and discourage attackers (e.g. by misleading reconnaissance via presenting plausible
      but false targets), in the goal of wasting the adversary''s efforts and resources.'
    references:
    - id: greynoise
      title: Threat Actors Actively Targeting LLMs
      url: https://www.greynoise.io/blog/threat-actors-actively-targeting-llms
    - id: zenity
      title: 'Scanning for AI: Live Campaigns Mapping the Internet''s Exposed LLM
