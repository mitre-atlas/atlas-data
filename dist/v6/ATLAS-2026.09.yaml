  AML.CS0058:
    name: Google Photos AI Model Extraction
    description: Skyld researchers analyzed the Google Photos Android application
      and recovered TensorFlow Lite models used by AI-powered photo editing and image
      analysis features. The researchers found models stored unencrypted in the application's
      assets, embedded in the native library, and encrypted on disk. They used static
      reverse engineering to locate TFLite artifacts and dynamic instrumentation with
      Frida to capture encrypted models after runtime decryption. The recovered models
      provided white-box access to proprietary Google Photos model artifacts.
