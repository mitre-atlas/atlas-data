  AML.CS0061:
    name: 'AI in the Middle: Web-Based AI Services as C2 Relays'
    description: 'Check Point Research demonstrated an "AI in the Middle" attack in
      which malware can abuse web-based AI assistants with anonymous or unauthenticated
      browsing and URL-fetch capabilities as a covert command-and-control channel.
      The proof of concept used public AI web interfaces, including Grok and Microsoft
      Copilot, to cause the AI service to fetch attacker-controlled URLs, relay victim
      data in outbound requests, and return attacker-supplied commands through normal
      AI assistant responses.


      Because the implant communicated with trusted AI service domains over ordinary
      HTTPS web traffic, the activity could blend into expected enterprise AI usage
      and evade controls focused on suspicious infrastructure, unusual protocols,
      API keys, service accounts, or revocable credentials. The lack of required authentication
      for some web-fetch workflows also made it harder for defenders to disable the
      channel by rotating API keys, suspending accounts, or revoking tokens. The researchers
      recommended stronger authentication and access controls for AI web-fetch features,
      along with improved visibility into AI-initiated network requests and AI assistant
      interactions.'
    references:
    - id: checkpoint-ai-in-the-middle
      title: 'AI in the Middle: Turning Web-Based AI Services into C2 Proxies & The
        Future Of AI Driven Attacks'
      url: https://research.checkpoint.com/2026/ai-in-the-middle-turning-web-based-ai-services-into-c2-proxies-the-future-of-ai-driven-attacks/
    created-date: '2026-06-30'
