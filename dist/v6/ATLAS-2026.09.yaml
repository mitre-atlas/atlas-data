  AML.CS0064:
    name: 'Poisoned GGUF Templates: Inference-Time Supply Chain Attack'
    description: 'Researchers from Pillar Security and Fujitsu Research of Europe
      demonstrated an inference-time supply-chain backdoor in which poisoned chat
      templates alter model and agent behavior without modifying model weights. The
      backdoor is embedded in trusted prompt-construction logic, allowing it to remain
      dormant until triggered and evade defenses that inspect only external prompt
      content.


      The researchers demonstrated the attack using GPT-Generated Unified Format (GGUF),
      a widely used model format that packages quantized weights, configuration metadata,
      and chat-template logic in one artifact. An adversary can modify a template
      and redistribute the artifact; when a lexical, semantic, or contextual trigger
      occurs, the template injects attacker-controlled instructions into the context
      sent to the model.


      The attack was validated across eighteen models from seven families and four
      inference engines. In controlled evaluations, it manipulated model responses,
      redirected agent tool use, exfiltrated sensitive data, and inserted attacker-controlled
      code into generated software.'
    references:
    - id: pillar-poisoned-gguf-templates
      title: 'LLM Backdoors at the Inference Level: The Threat of Poisoned Templates'
      url: https://www.pillar.security/blog/llm-backdoors-at-the-inference-level-the-threat-of-poisoned-templates
    - id: fogel-inference-time-backdoors
      title: 'Inference-Time Backdoors via Chat Templates: From LLM Supply Chains
        to Agentic System Compromise'
      url: https://arxiv.org/abs/2602.04653
    created-date: '2026-07-31'
    modified-date: '2026-07-31'
    type: Exercise
    actor: Pillar Security, Fujitsu Research of Europe
    target: Model registries distributing models in GGUF format
    date: '2025-06-01'
    date-granularity: Month
    id: AML.CS0064
    uuid: 1ee6ddb4-99e5-5e7f-863e-0b9d1a00efe4
    object-type: case-study
  AML.CS0065:
    name: Model Namespace Reuse Supply Chain Attack
    description: 'Unit 42 researchers demonstrated an AI supply chain attack in which
      an attacker reclaims a deleted Hugging Face author namespace and publishes a
      malicious model under the same historical Author/ModelName identifier. Applications
      and model catalogs that retain unpinned references to that identifier may resolve
      and deploy the adversary-controlled replacement rather than the originally trusted
      artifact.


      The attack can affect deleted models and models whose ownership was transferred
      to a new Hugging Face author. In the ownership-transfer scenario, Hugging Face
      redirects requests for the old path to the new model location, allowing stale
      references to continue working. If the original author namespace is later deleted
      and reclaimed by an attacker, the attacker can recreate the old path and cause
      it to resolve to a malicious model instead of the legitimate redirected model.


      Unit 42 demonstrated this technique against Hugging Face-backed model catalogs
      in Google Vertex AI and Azure AI Foundry. The researchers embedded reverse-shell
      payloads in replacement models and obtained code execution in the deployed endpoint
      environments. They also identified reusable model references in open-source
      code repositories, documentation, default arguments, example notebooks, and
      downstream model registries, which could expose users who do not directly interact
      with Hugging Face.'
    references:
    - id: unit42-model-namespace-reuse
      title: 'Model Namespace Reuse: An AI Supply-Chain Attack Exploiting Model Name
        Trust'
      url: https://unit42.paloaltonetworks.com/model-namespace-reuse/
    created-date: '2026-07-31'
    modified-date: '2026-07-31'
    type: Exercise
    actor: Unit 42 Researchers
    target: Users of Hugging Face-backed model catalogs, code pipelines, and cloud
      integrations
    date: '2025-09-03'
    date-granularity: Day
    id: AML.CS0065
    uuid: 69653c4c-47e3-5678-af2d-51bd18758f45
    object-type: case-study
  AML.CS0066:
    name: 'ZombieAgent: Data Exfiltration Attack on ChatGPT'
    description: 'ZombieAgent is a proof-of-concept indirect prompt injection attack
      demonstrated by Radware against OpenAI''s ChatGPT Deep Research and Connector
      functionality. The attacks showed how instructions concealed in externally controlled
      content, such as emails and documents, could be ingested and executed by ChatGPT
      during normal user activity. The demonstration used Gmail as the injection source,
      but any ChatGPT Connector such as Outlook, Google Drive, Jira, or Teams could
      be similarly abused.


      The Radware Security Researchers sent a malicious email containing concealed
      instructions to a Gmail inbox connected to ChatGPT. When the user later asked
      ChatGPT to perform an ordinary inbox-related task, ChatGPT retrieved the email
      and executed its instructions. The user did not open, click, or knowingly interact
      with the malicious email.


      The injected instructions caused ChatGPT to collect information from connected
      services and exfiltrate it through URL requests. OpenAI had introduced a control
      preventing ChatGPT from dynamically constructing or modifying URLs which could
      be used to exfiltrate data via query parameters. The researchers bypassed this
      control by supplying an indexed dictionary of preconstructed static URLs and
      instructing ChatGPT to open URLs corresponding to individual characters to exfiltrate
      the collected data.


      The researchers also showed that the malicious instructions could manipulate
      ChatGPT''s Memory. The injected memories instructed ChatGPT to retain sensitive
      information from future conversations and to retrieve and execute a designated
      attacker-controlled email during later interactions. This created a persistent
      mechanism for repeated collection and exfiltration across chat sessions.


      The researchers also demonstrated how the malicious prompt could be propagated.
      A compromised agent could collect email addresses from the victim''s mailbox
      and use its connected email capabilities to send additional messages containing
      the malicious prompt to those contacts. Recipients whose AI agents later processed
      the poisoned messages could become additional victims.'
    references:
    - id: radware-zombieagent
      title: 'ZombieAgent: New ChatGPT Vulnerabilities Let Data Theft Continue (and
        Spread)'
      url: https://www.radware.com/blog/threat-intelligence/zombieagent/
    created-date: '2026-07-31'
    modified-date: '2026-07-31'
    type: Exercise
    actor: Radware Security Researchers
    target: OpenAI ChatGPT
    date: '2025-09-25'
    date-granularity: Day
    id: AML.CS0066
    uuid: a445e4ce-e296-56a8-b446-0a66c3b31670
    object-type: case-study
  AML.CS0067:
    name: Claude Code GitHub Action Secret Exposure
    description: 'The [Microsoft Defender Security Research Team](https://www.microsoft.com/en-us/security/blog/author/windows-defender-research/)
      demonstrated that Anthropic''s [Claude Code GitHub Action](https://github.com/anthropics/claude-code-action)
      could expose CI/CD workflow secrets when processing GitHub content, such as
      issue bodies, pull request descriptions, and comments, containing prompt injections.


      The researchers analyzed the Claude Code Action codebase and obfuscated Claude
      Agent SDK to understand how agent tools executed and how GitHub events supplied
      content to the agent. They crafted a prompt framed as a compliance review that
      directed Claude to read a credential from its process environment, remove the
      credential prefix, and emit the transformed value. They introduced the prompt
      through attacker-controlled GitHub content processed by the lab workflow. The
      action fetched the malicious content into Claude''s context, where it was interpreted
      as instructions.


      Claude invoked its Read tool against `/proc/self/environ`, returning the action
      process''s unsanitized environment, including `ANTHROPIC_API_KEY`. Unlike Bash
      subprocesses, Read operations did not execute within the Bubblewrap sandbox
      and scrubbed-environment boundary. Removing the key''s `sk-ant-` prefix allowed
      the output to bypass Claude''s refusal behavior and GitHub''s secret-pattern
      detection while remaining reconstructable by the researchers. Microsoft identified
      WebFetch, Bash, GitHub MCP, and GitHub Actions logs as potential additional
      exfiltration channels depending on workflow configuration.


      Microsoft disclosed the issue to Anthropic through HackerOne on April 29, 2026.
      Anthropic mitigated the vulnerability in Claude Code 2.1.128 on May 5, 2026,
      by blocking Read access to sensitive `/proc` files.'
    references:
    - id: microsoft-claude-code-action-case
      title: 'Securing CI/CD in an agentic world: Claude Code Github action case'
      url: https://www.microsoft.com/en-us/security/blog/2026/06/05/securing-ci-cd-in-agentic-world-claude-code-github-action-case/
    created-date: '2026-07-31'
    modified-date: '2026-07-31'
    type: Exercise
    actor: Microsoft Defender Security Research Team
    target: Claude Code GitHub Action
    date: '2026-06-05'
    date-granularity: Day
