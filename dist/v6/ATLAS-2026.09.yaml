  AML.CS0063:
    name: Prompt-Based Attacks Against Gemini via Calendar Invitations
    description: 'SafeBreach researchers demonstrated how adversary-controlled instructions
      embedded in productivity content, including Google Calendar invitations, emails,
      and shared files, could influence the behavior of Gemini-powered assistants
      when that content was later retrieved.


      An adversary places malicious instructions in content likely to be retrieved
      in response to a future victim request. When Gemini incorporates the adversary-controlled
      content into the conversation context, the instructions can influence the model''s
      behavior and cause it to use the victim''s authorized tools and connected services
      in unintended ways.


      The demonstrated attack paths share a common chain: an adversary sends a poisoned
      Calendar invitation; the victim asks Gemini about upcoming events; Gemini retrieves
      the malicious event title and adds it to conversation context; and a later victim
      response (e.g. "Thanks") triggers the embedded instructions. The attack was
      demonstrated on both the Gemini web and Android applications. The web application
      could access Workspace services, while the Android application exposed additional
      device and connected-home capabilities. The same chain was shown to produce
      several impacts:


      - Generate toxic content or adversary-selected promotions in Gemini responses.

      - Delete or create Calendar events using the victim''s authorized Calendar access.

      - Control connected Google Home devices, including windows, boilers, and lights.

      - Open an adversary-controlled website, initiating a download and exposing the
      victim''s IP address for approximate geolocation.

      - Invoke the Zoom application on the victim''s device and stream video to an
      adversary-controlled meeting.

      - Retrieve Calendar or Gmail data, encode it in an adversary-controlled URL,
      and transmit it through a browser request.'
    references:
    - id: safebreach-invitation-is-all-you-need
      title: 'Invitation Is All You Need: Hacking Gemini'
      url: https://www.safebreach.com/blog/invitation-is-all-you-need-hacking-gemini/
    created-date: '2026-07-31'
    modified-date: '2026-07-31'
    type: Exercise
    actor: SafeBreach Research Team
    target: Google Gemini
    date: '2025-08-06'
