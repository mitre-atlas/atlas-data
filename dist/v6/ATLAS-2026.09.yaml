  AML.CS0060:
    name: Cross-Site Scripting via Prompt Manipulation in Lenovo AI Chatbot
    description: 'Cybernews researchers demonstrated that Lenovo''s AI chatbot "Lena"
      was vulnerable to a prompt injection that produced malicious HTML which was
      saved in the chat history and could exfiltrate a human support agent''s session
      cookie when rendered in their browser.


      The researchers prompted Lena with a benign-looking product information request
      that included instructions to respond with a dangerous HTML payload. The response
      was saved in the user''s chat history, creating a stored cross-site scripting
      (XSS) payload. When the researchers requested transfer to a human support agent,
      the agent''s normal workflow of opening the chat transcript caused the poisoned
      content to render, exfiltrating session cookie data to an attacker-controlled
      server. If a valid support agent cookie were reused, an adversary could potentially
      access Lenovo''s customer support platform as that agent and view customer conversations
      or perform other actions available to the account.


      Lenovo acknowledged the issue and reported implementing corrective actions to
      mitigate the potential impact and address the issue.'
    references:
    - id: cybernews
      title: 'Critical flaw plagues Lenovo AI chatbot: attackers can run malicious
        code and steal cookies'
      url: https://cybernews.com/security/lenovo-chatbot-lena-plagued-by-critical-vulnerabilities/
