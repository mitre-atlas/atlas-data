  AML.CS0059:
    name: 'EchoLeak: Zero-Click Prompt Injection Targeting M365 Copilot for Data Exfiltration'
    description: 'Aim Security researchers discovered EchoLeak, a zero-click vulnerability
      in Microsoft 365 Copilot that could allow an attacker to exfiltrate sensitive
      enterprise data without user interaction.


      The attack used a prompt injection delivered via an email sent to a target user.
      When M365 Copilot retrieved the email as part of its retrieval-augmented generation
      (RAG) context, the malicious instructions caused Copilot to search the user''s
      accessible Microsoft 365 data and include sensitive information in its response
      context. The sensitive information was then exfiltrated via requests to attacker-controlled
      URLs without requiring the victim to open the email or click a link.


      The attack chain bypassed multiple protections, including prompt injection defenses,
      link redaction, and content security policy restrictions.


      Microsoft assigned the issue CVE-2025-32711[[cve-2025-32711]]. It has since
      been remediated with no evidence it was exploited in the wild.'
    references:
    - id: echoleak-paper
      title: 'EchoLeak: The First Real-World Zero-Click Prompt Injection Exploit in
        a Production LLM System'
      url: https://arxiv.org/abs/2509.10540
    - id: cve-2025-32711
      title: CVE-2025-32711
      url: https://www.cve.org/CVERecord?id=CVE-2025-32711
    - id: cato
      title: Breaking down 'EchoLeak', the First Zero-Click AI Vulnerability Enabling
        Data Exfiltration from Microsoft 365 Copilot
      url: https://www.catonetworks.com/blog/breaking-down-echoleak/
